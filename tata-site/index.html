<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>挞挞的小站</title>
<style>
  :root{
    --paper:#f2efe7;
    --card:#fffdf8;
    --ink:#1d1b18;
    --muted:#8d8579;
    --line:#e3ddd0;
    --accent:#b05a32;
    --blue:#5b7b8c;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{height:100%}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:680px; margin:0 auto; padding:22px 18px 84px}

  /* ---------- 顶栏 ---------- */
  #topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:26px}
  .brand{display:flex; align-items:center; gap:9px; font-size:13px; letter-spacing:.02em}
  .brand-dot{width:9px;height:9px;border-radius:50%;background:var(--accent);display:inline-block}
  .tip{font-size:11px; color:var(--muted); white-space:nowrap}
  kbd{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10.5px;
    border:1px solid var(--line); border-bottom-width:2px; border-radius:5px;
    padding:1px 5px; background:#fffdf8; color:var(--ink);
  }

  /* ---------- 个人区 ---------- */
  .profile{display:flex; align-items:center; gap:18px; margin-bottom:22px}
  .avatar{
    position:relative; width:88px; height:88px; flex:0 0 88px;
    border-radius:50%; border:none; background:var(--card) center/cover no-repeat;
    padding:0; cursor:pointer; display:grid; place-items:center;
    box-shadow:inset 0 0 0 1px var(--line), 0 0 0 4px #fffdf8, 0 0 0 5px var(--line);
  }
  .avatar-ph{font-size:30px; font-weight:600; color:var(--accent); letter-spacing:.04em}
  .avatar-badge{
    position:absolute; right:-6px; bottom:-6px; width:24px; height:24px; border-radius:50%;
    display:grid; place-items:center; font-size:10px; line-height:1;
    background:#fffdf8; color:var(--muted); box-shadow:0 0 0 1px var(--line);
  }
  .avatar-clear{
    position:absolute; top:-6px; right:-6px; width:20px; height:20px; border-radius:50%;
    border:none; background:#fffdf8; color:var(--muted); font-size:12px; line-height:20px;
    text-align:center; cursor:pointer; padding:0; box-shadow:0 0 0 1px var(--line);
  }
  .avatar-clear:hover{color:var(--ink)}
  .who{flex:1; min-width:0}
  .eyebrow{font-size:9.5px; letter-spacing:.22em; text-transform:uppercase; color:var(--muted); margin-bottom:6px}
  .name-row{display:flex; align-items:baseline; gap:10px}
  .name{font-size:26px; font-weight:600; margin:0; letter-spacing:.01em; cursor:text; line-height:1.2}
  .name-edit{
    font:inherit; font-size:24px; font-weight:600; width:100%; max-width:220px;
    border:none; border-bottom:1px solid var(--ink); background:transparent; padding:0 0 2px; outline:none;
  }
  .edit-btn{
    border:none; background:none; color:var(--muted); font:inherit; font-size:11px;
    cursor:pointer; padding:0; text-decoration:underline; text-underline-offset:3px;
  }
  .edit-btn:hover{color:var(--ink)}
  .tagline{font-size:13px; color:var(--muted); margin:8px 0 0; line-height:1.55; cursor:text}
  .tag-edit{
    font:inherit; font-size:13px; width:100%; border:none; border-bottom:1px solid var(--line);
    background:transparent; padding:2px 0; outline:none; color:var(--ink); margin-top:8px;
  }

  .stats{display:flex; gap:10px; margin-bottom:22px}
  .stat{
    flex:1; background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:10px 12px;
  }
  .stat span{display:block; font-size:9.5px; letter-spacing:.14em; color:var(--muted); text-transform:uppercase; margin-bottom:5px}
  .stat b{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; font-weight:600;
    font-variant-numeric:tabular-nums; letter-spacing:-.01em;
  }

  /* ---------- 卡片 ---------- */
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:12px}
  .grid .card:last-child:nth-child(odd){grid-column:1 / -1}
  @media (max-width:560px){ .grid{grid-template-columns:1fr} }
  .card{
    text-align:left; font:inherit; color:inherit; cursor:pointer;
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:16px 16px 14px; display:flex; flex-direction:column; gap:6px;
    transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease;
  }
  .card:hover{transform:translateY(-2px); border-color:#d6cebc; box-shadow:0 12px 26px -20px rgba(29,27,24,.5)}
  .card:active{transform:translateY(0)}
  .card-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:2px}
  .idx{font-family:ui-monospace,Menlo,monospace; font-size:11px; color:var(--muted)}
  .tag{font-size:10px; color:var(--accent); border:1px solid #ead9c9; background:#fdf6ef; border-radius:999px; padding:2px 8px}
  .card-title{font-size:17px; font-weight:600; letter-spacing:.01em}
  .card-desc{font-size:12px; line-height:1.6; color:var(--muted); min-height:38px}
  .card-go{font-size:11.5px; color:var(--ink); margin-top:2px}

  .foot{
    display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap;
    margin-top:26px; font-size:11px; color:var(--muted);
  }

  /* ---------- 游戏舞台 ---------- */
  .stage-bar{display:flex; align-items:center; gap:14px; margin-bottom:14px}
  .back{
    border:1px solid var(--line); background:var(--card); color:var(--ink);
    font:inherit; font-size:12px; padding:6px 12px; border-radius:999px; cursor:pointer;
  }
  .back:hover{border-color:#d6cebc}
  .stage-title{font-size:15px; font-weight:600; flex:1}
  .stage-right{color:var(--muted)}

  .gbar{display:flex; gap:10px; margin-bottom:12px}
  .gbar .stat{padding:8px 12px}
  .gbar .stat b{font-size:15px}

  .board{
    position:relative; background:var(--card); border:1px solid var(--line);
    border-radius:18px; overflow:hidden;
    box-shadow:0 1px 2px rgba(29,27,24,.04), 0 14px 32px -26px rgba(29,27,24,.45);
  }
  canvas{display:block; width:100%; height:auto; touch-action:none}
  .board canvas{cursor:crosshair}

  .ov{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:8px; text-align:center; padding:22px;
    background:rgba(255,253,248,.9); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);
  }
  .ov-kicker{font-size:10px; letter-spacing:.24em; color:var(--accent); text-transform:uppercase}
  .ov-title{font-size:23px; font-weight:600; letter-spacing:.02em}
  .ov-sub{font-size:12.5px; line-height:1.65; color:var(--muted); max-width:340px}
  .btn{
    border:1px solid var(--ink); background:var(--ink); color:#fdfbf6; font:inherit; font-size:13px;
    padding:9px 20px; border-radius:999px; cursor:pointer; margin-top:8px;
    transition:opacity .12s ease, transform .12s ease;
  }
  .btn:hover{opacity:.86}
  .btn:active{transform:scale(.97)}
  .btn.ghost{background:transparent; color:var(--ink); border-color:var(--line)}
  .btn.ghost:hover{border-color:#cfc6b3}
  .btn.dark{background:var(--ink)}

  .hint{font-size:11.5px; color:var(--muted); margin-top:12px; line-height:1.7}
  .hint kbd{margin:0 1px}

  /* ---------- 双人对撞大厅 ---------- */
  .duel-lobby{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:20px 18px; text-align:center}
  .vs-row{display:flex; align-items:center; justify-content:center; gap:18px; margin-bottom:16px}
  .side{width:120px}
  .side .ava{
    width:64px; height:64px; border-radius:50%; margin:0 auto 8px;
    border:1px solid var(--line); background:#f7f2e8; overflow:hidden;
    display:grid; place-items:center; font-size:20px; font-weight:600; color:var(--accent);
    background-size:cover; background-position:center;
  }
  .side .nm{font-size:13px; font-weight:600; margin-bottom:3px}
  .side .keys{font-size:10.5px; color:var(--muted); letter-spacing:.06em}
  .vs{font-size:13px; color:var(--muted); letter-spacing:.2em}
  .duel-actions{display:flex; gap:10px; justify-content:center; flex-wrap:wrap}

  /* ---------- 记忆翻牌 ---------- */
  .mem-wrap{max-width:460px; margin:0 auto}
  .mem-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:9px}
  .mcard{
    position:relative; aspect-ratio:1; border-radius:12px; border:1px solid var(--line);
    background:#f7f2e8; cursor:pointer; padding:0; font:inherit;
    display:grid; place-items:center; font-size:26px; color:var(--ink);
    transition:transform .12s ease, background .12s ease, border-color .12s ease;
  }
  .mcard::after{
    content:''; width:7px; height:7px; border-radius:50%; background:#d8cfbc;
  }
  .mcard.up{background:#fffdf8; border-color:#d6cebc}
  .mcard.up::after{display:none}
  .mcard.up span{display:block}
  .mcard span{display:none}
  .mcard.done{opacity:.4; cursor:default}
  .mem-bar{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; font-size:12px; color:var(--muted)}
  .mem-bar b{font-family:ui-monospace,Menlo,monospace; color:var(--ink); font-size:15px}

  /* ---------- 合拍卡 ---------- */
  .match-wrap{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:16px}
  .match-pick{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:12px; margin-bottom:14px}
  .pick-slot{
    display:flex; flex-direction:column; align-items:center; gap:6px;
    border:1px dashed #ddd4c2; border-radius:14px; padding:12px 8px; cursor:pointer;
    background:#fdfaf3; font:inherit; color:inherit;
  }
  .pick-slot:hover{border-color:#c9bfa9}
  .pick-slot .ava{
    width:56px; height:56px; border-radius:50%; background:#f2ece0; overflow:hidden;
    display:grid; place-items:center; font-size:17px; font-weight:600; color:var(--accent);
    background-size:cover; background-position:center; border:1px solid var(--line);
  }
  .pick-slot .cap{font-size:11px; color:var(--muted)}
  .pick-slot input{
    border:none; background:transparent; text-align:center; font:inherit; font-size:12px;
    color:var(--ink); outline:none; width:100%; border-bottom:1px solid var(--line); padding:2px 0;
  }
  .match-plus{font-size:15px; color:var(--muted)}
  .match-canvas-wrap{border:1px solid var(--line); border-radius:14px; overflow:hidden; background:#f4f1ea}
  .match-canvas-wrap canvas{cursor:default}
  .match-actions{display:flex; gap:10px; justify-content:center; margin-top:14px; flex-wrap:wrap}

  /* ---------- 难度 ---------- */
  .diff{display:flex; gap:6px; align-items:center; flex-wrap:wrap}
  .diff .lb{font-size:10px; letter-spacing:.16em; color:var(--muted); text-transform:uppercase; margin-right:2px}
  .pill{
    font:inherit; font-size:12px; padding:5px 13px; border-radius:999px; cursor:pointer;
    border:1px solid var(--line); background:var(--card); color:var(--muted);
    transition:all .14s ease;
  }
  .pill:hover{color:var(--ink); border-color:#d6cebc}
  .pill.on{background:var(--ink); color:#fdfbf6; border-color:var(--ink)}
  .rowline{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; flex-wrap:wrap}
  .mini{font-size:12px; padding:6px 14px; margin:0}

  .meters{display:flex; gap:14px; margin:12px 2px 12px}
  .meter{flex:1; display:flex; align-items:center; gap:8px; font-size:10.5px; color:var(--muted)}
  .meter i{flex:1; height:6px; border-radius:99px; background:#ece5d6; display:block; overflow:hidden}
  .meter i b{display:block; height:100%; width:0; border-radius:99px; background:#d9a15f; transition:width .3s ease}
  .meter.clean i b{background:#8fb4c2}
  .meter.mood i b{background:#d4756f}
  .acts{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:10px}
  .acts .btn{padding:9px 0; font-size:12.5px}
  .coop{display:flex; gap:8px; margin-bottom:4px}
  .coop .btn{flex:1}
  .coop .btn.hot{background:var(--ink); color:#fffdf8; border-color:var(--ink)}
  .disc-holder{position:relative; display:flex}

  /* ---------- 传讯字卡 ---------- */
  .note-stage{display:grid; place-items:center; padding:4px 0 16px}
  .note-card{
    position:relative; width:100%; max-width:400px; min-height:198px; padding:22px 26px 34px;
    border:1px solid var(--line); border-radius:6px;
    box-shadow:0 1px 2px rgba(29,27,24,.05), 0 18px 34px -28px rgba(29,27,24,.5);
    transform:rotate(-.6deg); transition:transform .2s ease;
  }
  .note-card.skin-line{
    background:
      repeating-linear-gradient(180deg, transparent 0 27px, #e7dfcd 27px 28px),
      linear-gradient(#fffdf8,#fffdf8);
    background-position:0 20px, 0 0;
  }
  .note-card.skin-sticky{background:#fdf3d6; border-color:#ecdcb4; border-radius:4px}
  .note-card.skin-post{background:#f6f3eb; border-color:#dcd5c4}
  .note-card.skin-post::after{
    content:''; position:absolute; right:10px; top:10px; width:26px; height:32px;
    border:1.5px dashed #d9a08a; border-radius:2px; background:#fdf1ea; opacity:.85;
  }
  .note-card.skin-grid{
    background:
      repeating-linear-gradient(0deg, transparent 0 23px, #eae3d3 23px 24px),
      repeating-linear-gradient(90deg, transparent 0 23px, #eae3d3 23px 24px),
      #fffdf8;
    background-position:0 0, 0 0, 0 0;
  }
  .note-text{
    position:relative; z-index:1;
    font-size:15px; line-height:28px; white-space:pre-wrap; word-break:break-word;
    min-height:112px; color:var(--ink);
  }
  .note-empty{font-size:12.5px; color:#c3baa8; line-height:28px}
  .note-stamp{
    position:absolute; right:18px; bottom:14px; width:34px; height:34px; border-radius:8px;
    display:grid; place-items:center; font-size:16px; color:var(--accent);
    border:1.5px solid #d9a08a; background:#fdf1ea; transform:rotate(-8deg);
  }
  .note-date{position:absolute; left:26px; bottom:16px; font-size:10.5px; color:var(--muted); letter-spacing:.1em}
  .note-input{margin-bottom:12px}
  .note-ta{
    width:100%; resize:none; font:inherit; font-size:13.5px; line-height:1.7; color:var(--ink);
    background:var(--card); border:1px solid var(--line); border-radius:12px; padding:11px 13px; outline:none;
  }
  .note-ta:focus{border-color:#d6cebc}
  .note-toast{font-size:11.5px; color:var(--accent); margin-left:8px}
  .note-wall-head{display:flex; align-items:center; gap:8px; font-size:10.5px; color:var(--muted); letter-spacing:.16em; margin:18px 2px 8px; text-transform:uppercase}
  .note-wall-head b{font-family:ui-monospace,Menlo,monospace; color:var(--ink); letter-spacing:0; font-size:11px}
  .note-wall{display:grid; grid-template-columns:1fr 1fr; gap:9px}
  .note-mini{
    position:relative; text-align:left; font:inherit; font-size:12px; line-height:1.6; color:inherit;
    cursor:pointer; padding:10px 11px 26px; border:1px solid var(--line); border-radius:10px;
    background:#fffdf8; min-height:76px; overflow:hidden;
  }
  .note-mini:hover{border-color:#d6cebc}
  .note-mini .nm-txt{display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; word-break:break-word}
  .note-mini .nm-at{position:absolute; left:11px; bottom:8px; font-size:9.5px; color:var(--muted); letter-spacing:.06em}
  .note-mini .nm-del{
    position:absolute; right:4px; bottom:4px; border:none; background:none; color:#c9c0ae;
    font-size:14px; line-height:1; cursor:pointer; padding:3px 6px;
  }
  .note-mini .nm-del:hover{color:var(--accent)}
  .note-wall-empty{font-size:11.5px; color:#c3baa8; padding:6px 2px; grid-column:1 / -1}

  /* ---------- 棋 / 拔河 / 泡泡 ---------- */
  .go-wrap{max-width:470px; margin:0 auto}
  .go-wrap .board{cursor:pointer}
  .tug-wrap .board{cursor:pointer}
  .bub-wrap .board{cursor:crosshair}

  /* ---------- 背景音乐小光盘 ---------- */
  .disc-wrap{
    position:fixed; right:20px; bottom:20px; z-index:60;
    width:56px; height:56px;
  }
  .disc{
    position:relative; width:56px; height:56px; border-radius:50%; border:none; padding:0;
    cursor:pointer; background:#26231f; flex:0 0 56px;
    box-shadow:0 0 0 1px #14120f, 0 12px 26px -16px rgba(0,0,0,.8);
    transition:transform .18s ease;
  }
  .disc:hover{transform:scale(1.04)}
  .disc::before{
    content:''; position:absolute; inset:0; border-radius:50%;
    background:repeating-radial-gradient(circle at 50% 50%, #26231f 0 1px, #332f29 1px 2px);
  }
  .disc::after{
    content:''; position:absolute; left:50%; top:50%; width:18px; height:18px; margin:-9px 0 0 -9px;
    border-radius:50%; background:var(--accent);
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.3), 0 0 0 1px rgba(255,255,255,.12);
  }
  .disc .gleam{
    position:absolute; left:50%; top:50%; width:2px; height:20px; margin-left:-1px;
    transform-origin:50% 0; transform:translateY(-100%) rotate(28deg);
    background:linear-gradient(#fffdf8,rgba(255,253,248,0));
    border-radius:2px; opacity:.35;
  }
  .disc .hole{
    position:absolute; left:50%; top:50%; width:5px; height:5px; margin:-2.5px 0 0 -2.5px;
    border-radius:50%; background:#14120f;
  }
  .disc.spin{animation:discspin 6.5s linear infinite}
  @keyframes discspin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  .disc.off{filter:grayscale(.35) brightness(.9)}
  .disc-tab{
    position:absolute; left:-9px; top:-9px; width:20px; height:20px; border-radius:50%;
    border:1px solid var(--line); background:#fffdf8; color:var(--muted); font-size:10px;
    line-height:1; cursor:pointer; padding:0; display:grid; place-items:center;
  }
  .disc-tab:hover{color:var(--ink)}
  .disc-wrap.open .disc-panel, .disc-wrap:hover .disc-panel{opacity:1; pointer-events:auto; transform:none}
  .disc-panel{
    position:absolute; right:0; bottom:66px;
    width:238px; background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:13px 14px 12px; font-size:12px;
    box-shadow:0 18px 40px -30px rgba(29,27,24,.8);
    opacity:0; pointer-events:none; transform:translateY(6px);
    transition:opacity .18s ease, transform .18s ease;
  }
  .dp-head{display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:9px}
  .dp-head b{font-size:12.5px; font-weight:600}
  .dp-head span{font-size:10.5px; color:var(--muted); text-align:right; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .dp-btns{display:flex; gap:7px; margin-bottom:10px}
  .dp-btns .btn{flex:1; padding:7px 0; font-size:11.5px; margin:0}
  .dp-vol{display:flex; align-items:center; gap:8px; margin-bottom:9px; color:var(--muted); font-size:10.5px}
  .dp-vol input{flex:1; accent-color:var(--ink); height:3px}
  .dp-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px; max-height:104px; overflow:auto}
  .dp-list li{
    font-size:11px; color:var(--muted); padding:4px 7px; border-radius:7px; cursor:pointer;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .dp-list li:hover{background:#f5f0e5; color:var(--ink)}
  .dp-list li.on{background:#f2ece0; color:var(--ink)}
  .dp-tip{font-size:10px; color:#c3baa8; margin-top:7px; line-height:1.5}
  @media (max-width:560px){
    .disc-wrap{right:12px; bottom:12px; width:48px; height:48px}
    .disc{width:48px; height:48px; flex-basis:48px}
    .disc-panel{width:214px; bottom:58px}
  }

  /* ---------- 色调 ---------- */
  html[data-theme="cream"]{
    --paper:#f7f1e4; --card:#fffdf6; --ink:#221e17; --muted:#9a8f7c;
    --line:#e8ddc7; --accent:#c08050; --blue:#6d8a95;
  }
  html[data-theme="sakura"]{
    --paper:#f8eef0; --card:#fffbfc; --ink:#241d20; --muted:#9c8a90;
    --line:#eddade; --accent:#c2687f; --blue:#7a90a8;
  }
  html[data-theme="sky"]{
    --paper:#eef2f4; --card:#fbfdfe; --ink:#1b2226; --muted:#84939a;
    --line:#d9e2e7; --accent:#55809a; --blue:#4d7488;
  }
  html[data-theme="moss"]{
    --paper:#eff2ea; --card:#fcfdf9; --ink:#1f231c; --muted:#8a9184;
    --line:#dce3d3; --accent:#6b8a5b; --blue:#5f7d6b;
  }
  .themebar{display:flex; align-items:center; gap:12px; margin:-6px 0 18px}
  .themebar .lb{font-size:9.5px; letter-spacing:.2em; color:var(--muted); text-transform:uppercase}
  .swatches{display:flex; gap:9px; align-items:center}
  .sw{
    width:21px; height:21px; border-radius:50%; padding:0; cursor:pointer;
    border:1px solid var(--line); transition:transform .15s ease, box-shadow .15s ease;
  }
  .sw:hover{transform:translateY(-1.5px)}
  .sw.on{box-shadow:0 0 0 2px var(--card), 0 0 0 3.5px var(--ink)}

  /* ---------- 抓娃娃 / 钓鱼 ---------- */
  .claw-pad{display:flex; gap:9px; justify-content:center; margin-top:12px}
  .claw-pad .btn{min-width:88px}
  .claw-pad .js-grab{min-width:120px}

  /* ---------- 合拍卡项目 ---------- */
  .mt-head{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin:16px 2px 8px}
  .mt-head span:first-child{font-size:10.5px; letter-spacing:.16em; color:var(--muted); text-transform:uppercase}
  .mt-note{font-size:10.5px; color:#c3baa8}
  .mt-list{display:flex; flex-direction:column; gap:7px}
  .mt-row{display:grid; grid-template-columns:96px 1fr 54px 20px; align-items:center; gap:9px}
  .mt-row input[type="text"]{
    font:inherit; font-size:12px; width:100%; color:var(--ink); background:transparent;
    border:none; border-bottom:1px solid var(--line); padding:3px 0; outline:none;
  }
  .mt-row input[type="text"]:focus{border-color:var(--ink)}
  .mt-row .bar{height:6px; border-radius:99px; background:#ece5d6; overflow:hidden}
  .mt-row .bar i{display:block; height:100%; background:var(--accent); border-radius:99px; transition:width .18s ease}
  .mt-row input[type="number"]{
    font-family:ui-monospace,Menlo,monospace; font-size:12px; text-align:right; width:100%;
    color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:7px;
    padding:3px 6px; outline:none; -moz-appearance:textfield;
  }
  .mt-row input[type="number"]:focus{border-color:var(--ink)}
  .mt-row .del{
    border:none; background:none; color:#c9c0ae; font-size:15px; line-height:1;
    cursor:pointer; padding:0 2px;
  }
  .mt-row .del:hover{color:var(--accent)}
  .dp-row-sfx{display:flex; align-items:center; justify-content:space-between; color:var(--muted); font-size:10.5px; margin-bottom:4px}
  .dp-row-sfx .pill{font-size:10.5px; padding:3px 13px}


  /* ---------- 抽卡字卡 ---------- */
  .dc-head{display:flex; align-items:center; gap:8px; margin-bottom:10px; font-size:10.5px; color:var(--muted)}
  .dc-head .lb{letter-spacing:.14em; text-transform:uppercase}
  .dc-head input{
    font:inherit; font-size:12.5px; color:var(--ink); background:transparent;
    border:none; border-bottom:1px solid var(--line); padding:2px 0; outline:none; width:96px;
  }
  .dc-head .js-count{margin-left:auto; font-family:ui-monospace,Menlo,monospace; color:var(--ink); font-size:11px}
  .dc-stage{perspective:1400px; display:grid; place-items:center; padding:4px 0 14px}
  .dc{
    width:100%; max-width:340px; aspect-ratio:5 / 3.3; position:relative;
    transform-style:preserve-3d; transition:transform .55s cubic-bezier(.2,.9,.3,1); cursor:pointer;
  }
  .dc.flip{transform:rotateY(180deg)}
  .dc-face{
    position:absolute; inset:0; border-radius:14px; overflow:hidden;
    border:1px solid var(--line); background:var(--card);
    backface-visibility:hidden; -webkit-backface-visibility:hidden;
    box-shadow:0 18px 34px -28px rgba(29,27,24,.55);
  }
  .dc-front{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    background:linear-gradient(160deg,#fffdf8,#f3ecdd);
  }
  .dc-orn{font-size:18px; color:var(--accent); opacity:.85}
  .dc-name{font-size:20px; font-weight:600}
  .dc-tip{font-size:11px; color:var(--muted)}
  .dc-back{transform:rotateY(180deg); padding:18px 22px; display:flex; flex-direction:column}
  .dc-back.skin-line{background:repeating-linear-gradient(180deg, transparent 0 25px, #eae2d1 25px 26px), #fffdf8}
  .dc-back.skin-sticky{background:#fdf3d6; border-color:#ecdcb4}
  .dc-back.skin-grid{background:repeating-linear-gradient(0deg, transparent 0 22px, #eae3d3 22px 23px), repeating-linear-gradient(90deg, transparent 0 22px, #eae3d3 22px 23px), #fffdf8}
  .dc-kind{font-size:9.5px; letter-spacing:.2em; color:var(--accent); text-transform:uppercase}
  .dc-text{
    flex:1; display:flex; align-items:center; font-size:15px; line-height:1.85;
    white-space:pre-wrap; word-break:break-word; margin:8px 0 2px;
  }
  .dc-text.long{font-size:13px; line-height:1.75}
  .dc-stamp{
    position:absolute; right:16px; bottom:14px; width:30px; height:30px; border-radius:7px;
    display:grid; place-items:center; font-size:14px; color:var(--accent);
    border:1.5px solid #d9a08a; background:#fdf1ea; transform:rotate(-8deg);
  }
  .dc-date{font-size:10px; color:var(--muted); letter-spacing:.1em; padding-right:44px}
  .dc-last{font-size:11.5px; color:var(--muted); margin:10px 2px 0; text-align:center}
  .ce{margin-top:16px; border-top:1px solid var(--line); padding-top:14px}

  /* ---------- 存档按钮 ---------- */
  .top-actions{display:flex; gap:6px}
  .mini-btn{
    font:inherit; font-size:11px; padding:5px 11px; border-radius:999px; cursor:pointer;
    border:1px solid var(--line); background:var(--card); color:var(--muted);
    transition:color .14s ease, border-color .14s ease;
  }
  .mini-btn:hover{color:var(--ink); border-color:#d6cebc}
  .mt-texts{display:flex; flex-direction:column; gap:7px; margin-top:11px}
  .mt-line{
    font:inherit; font-size:12px; width:100%; color:var(--ink); background:var(--card);
    border:1px solid var(--line); border-radius:9px; padding:7px 10px; outline:none;
  }
  .mt-line:focus{border-color:var(--ink)}

  /* ---------- 自动保存提示 / 手机端 ---------- */
  .warn{
    font-size:11.5px; line-height:1.6; color:#8a5a3a; background:#fdf1ea;
    border:1px solid #ecd6c6; border-radius:10px; padding:9px 12px; margin-bottom:16px;
  }
  .save-stamp{font-family:ui-monospace,Menlo,monospace; font-size:10.5px; color:var(--ink); font-weight:500}
  .foot b{font-weight:500; color:var(--muted)}

  .pads{display:flex; gap:12px; margin-top:12px}
  .pad{flex:1; display:grid; grid-template-columns:repeat(3,1fr); gap:6px}
  .pad .sp{visibility:hidden}
  .pad button{
    aspect-ratio:1; border:1px solid var(--line); background:var(--card); color:var(--ink);
    border-radius:12px; font-size:14px; line-height:1; cursor:pointer; padding:0;
    -webkit-user-select:none; user-select:none;
  }
  .pad button:active{background:#f1ebdd; transform:scale(.97)}
  .pad-name{font-size:10px; color:var(--muted); text-align:center; margin-top:6px; letter-spacing:.1em}

  @media (max-width:560px){
    #app{padding:18px 14px 96px}
    .card{padding:14px 14px 12px}
    .btn{padding:11px 20px}
    .gbar{gap:8px}
    .gbar .stat{padding:7px 10px}
    .gbar .stat b{font-size:14px}
    .pads{gap:8px}
    .disc-panel{width:206px}
    .mt-row{grid-template-columns:84px 1fr 48px 18px; gap:7px}
    .note-wall{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<div id="app">
  <header id="topbar">
    <div class="brand"><span class="brand-dot"></span><span id="brandName">挞挞的小站</span></div>
    <div class="top-actions"><button class="mini-btn js-save-file" type="button">存到本地</button><button class="mini-btn js-load-file" type="button">读存档</button></div>
  </header>

  <!-- 个人主页 -->
  <main id="viewHome">
    <div class="warn" id="saveWarn" hidden>这台浏览器不让本地保存（可能是隐私模式），换个浏览器或者从网址打开，就能自动记住你的东西了。</div>

    <section class="profile">
      <button class="avatar" id="avatarBtn" aria-label="换头像">
        <span class="avatar-ph" id="avatarPh">挞</span>
        <span class="avatar-badge">换</span>
        <span class="avatar-clear" id="avatarClear" hidden>×</span>
      </button>
      <div class="who">
        <div class="eyebrow">personal space</div>
        <div class="name-row">
          <h1 class="name" id="nameShow">挞挞</h1>
          <input class="name-edit" id="nameEdit" maxlength="12" hidden>
          <button class="edit-btn" id="nameBtn">改昵称</button>
        </div>
        <p class="tagline" id="taglineShow">点一下，写一句自己的话。</p>
        <input class="tag-edit" id="taglineEdit" maxlength="40" hidden>
      </div>
    </section>

    <section class="stats">
      <div class="stat"><span>耳机线最高</span><b id="statCord">0</b></div>
      <div class="stat"><span>翻牌最佳</span><b id="statMem">—</b></div>
      <div class="stat"><span>双人战绩</span><b id="statDuel">0 : 0</b></div>
    </section>

    <div class="themebar" id="themebar"><span class="lb">色调</span><div class="swatches js-swatches"></div></div>

    <section class="grid" id="grid"></section>

    <footer class="foot">
      <span>自动保存 · <b class="save-stamp" id="saveStamp">刚刚</b>，都存在这台设备上，不会上传。</span>
      <span>挞挞的小站</span>
    </footer>
  </main>

  <!-- 游戏舞台 -->
  <main id="viewStage" hidden>
    <div class="stage-bar">
      <button class="back" id="backBtn">← 返回</button>
      <div class="stage-title" id="stageTitle"></div>
      <div class="stage-right"></div>
    </div>
    <div id="stageRoot"></div>
  </main>
</div>

<!-- 背景音乐小光盘 -->
<div class="disc-wrap" id="discWrap">
  <div class="disc-panel" id="discPanel">
    <div class="dp-head"><b>背景音乐</b><span class="js-mname">内置 · 慢板</span></div>
    <div class="dp-btns">
      <button class="btn ghost mini js-mplay" type="button">播放</button>
      <button class="btn ghost mini js-mimp" type="button">导入音频</button>
    </div>
    <div class="dp-row-sfx"><span>音效</span><button class="pill js-sfx" type="button">开</button></div>
    <div class="dp-vol"><span>音量</span><input class="js-mvol" type="range" min="0" max="100" value="42"></div>
    <ul class="dp-list js-mlist"></ul>
    <div class="dp-tip">内置是一段现场合成的纯音乐，不联网也能放；也可以塞自己存的歌进去。</div>
  </div>
  <div class="disc-holder">
    <button class="disc off" id="discBtn" type="button" title="播放 / 暂停背景音乐"><span class="gleam"></span><span class="hole"></span></button>
    <button class="disc-tab" id="discTab" type="button" title="音乐设置">···</button>
  </div>
</div>

<input type="file" id="filePick" accept="image/*" hidden>
<input type="file" id="audioPick" accept="audio/*" multiple hidden>
<input type="file" id="savePick" accept="application/json,.json" hidden>

<script>
(function () {
  'use strict';

  /* ==================== 存储 ==================== */
  var K = {
    profile: 'tata.site.profile',
    rival: 'tata.site.rival',
    stats: 'tata.site.stats',
    theme: 'tata.site.theme'
  };

  function load(key, def) {
    try {
      var raw = window.localStorage.getItem(key);
      return raw ? JSON.parse(raw) : def;
    } catch (e) { return def; }
  }
  var saveWarned = false;
  function markSaved() {
    var el = document.getElementById('saveStamp');
    if (!el) return;
    var d = new Date();
    el.textContent = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2) + ' 已保存';
  }
  function showSaveWarn() {
    if (saveWarned) return;
    saveWarned = true;
    var w = document.getElementById('saveWarn');
    if (w) w.hidden = false;
  }

  function save(key, val) {
    try {
      window.localStorage.setItem(key, JSON.stringify(val));
      markSaved();
      return true;
    } catch (e) {
      showSaveWarn();
      return false;
    }
  }

  var profile = load(K.profile, { name: '挞挞', tagline: '耳机常驻，摸鱼有度。', avatar: '' });
  if (!profile.name) profile.name = '挞挞';
  var rival = load(K.rival, { name: '对面', avatar: '' });
  var stats = load(K.stats, { cordBest: 0, memBest: 0, duelW: 0, duelL: 0 });

  var imgCache = {};
  function getImg(url) {
    if (!url) return null;
    if (imgCache[url]) {
      var im = imgCache[url];
      return (im.complete && im.naturalWidth) ? im : null;
    }
    var img = new Image();
    img.src = url;
    imgCache[url] = img;
    return null;
  }
  function preload(url, cb) {
    if (!url) return;
    var img = new Image();
    img.onload = function () { imgCache[url] = img; if (cb) cb(img); };
    img.src = url;
    imgCache[url] = img;
  }

  /* ==================== 图片选择 / 压缩 ==================== */
  var filePick = document.getElementById('filePick');
  var pickCb = null;

  function pickImage(cb) {
    pickCb = cb;
    filePick.value = '';
    filePick.click();
  }
  filePick.addEventListener('change', function () {
    var f = filePick.files && filePick.files[0];
    if (!f || !pickCb) return;
    var cb = pickCb;
    pickCb = null;
    downscale(f, 512, cb);
  });

  function downscale(file, max, cb) {
    var fr = new FileReader();
    fr.onload = function () {
      var im = new Image();
      im.onload = function () {
        var s = Math.min(1, max / Math.max(im.width, im.height));
        var w = Math.max(1, Math.round(im.width * s));
        var h = Math.max(1, Math.round(im.height * s));
        var c = document.createElement('canvas');
        c.width = w; c.height = h;
        var cctx = c.getContext('2d');
        cctx.fillStyle = '#fffdf8';
        cctx.fillRect(0, 0, w, h);
        cctx.drawImage(im, 0, 0, w, h);
        var url = c.toDataURL('image/jpeg', 0.86);
        cb(url);
      };
      im.onerror = function () {};
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  }

  /* ==================== 个人主页 ==================== */
  var viewHome = document.getElementById('viewHome');
  var viewStage = document.getElementById('viewStage');
  var stageRoot = document.getElementById('stageRoot');
  var stageTitle = document.getElementById('stageTitle');
  var brandName = document.getElementById('brandName');

  var avatarBtn = document.getElementById('avatarBtn');
  var avatarPh = document.getElementById('avatarPh');
  var avatarClear = document.getElementById('avatarClear');

  var nameShow = document.getElementById('nameShow');
  var nameEdit = document.getElementById('nameEdit');
  var nameBtn = document.getElementById('nameBtn');
  var taglineShow = document.getElementById('taglineShow');
  var taglineEdit = document.getElementById('taglineEdit');

  var statCord = document.getElementById('statCord');
  var statMem = document.getElementById('statMem');
  var statDuel = document.getElementById('statDuel');
  var grid = document.getElementById('grid');

  function renderProfile() {
    nameShow.textContent = profile.name;
    taglineShow.textContent = profile.tagline || '点一下，写一句自己的话。';
    brandName.textContent = profile.name + '的小站';
    document.title = profile.name + '的小站';

    if (profile.avatar) {
      avatarBtn.style.backgroundImage = 'url("' + profile.avatar + '")';
      avatarPh.hidden = true;
      avatarClear.hidden = false;
    } else {
      avatarBtn.style.backgroundImage = '';
      avatarPh.hidden = false;
      avatarPh.textContent = (profile.name || '我').slice(0, 1);
      avatarClear.hidden = true;
    }
    preload(profile.avatar);
  }

  function renderStats() {
    statCord.textContent = stats.cordBest || 0;
    statMem.textContent = memBestVal() ? memBestVal() + ' 步' : '—';
    statDuel.textContent = (stats.duelW || 0) + ' : ' + (stats.duelL || 0);
  }

  avatarBtn.addEventListener('click', function (e) {
    if (e.target === avatarClear) return;
    pickImage(function (url) {
      profile.avatar = url;
      save(K.profile, profile);
      renderProfile();
      refreshCards();
    });
  });

  avatarClear.addEventListener('click', function (e) {
    e.stopPropagation();
    profile.avatar = '';
    save(K.profile, profile);
    renderProfile();
    refreshCards();
  });

  function startNameEdit() {
    nameEdit.value = profile.name;
    nameEdit.hidden = false;
    nameShow.hidden = true;
    nameBtn.hidden = true;
    nameEdit.focus();
    nameEdit.select();
  }
  function commitName() {
    var v = (nameEdit.value || '').trim();
    if (v) profile.name = v.slice(0, 12);
    nameEdit.hidden = true;
    nameShow.hidden = false;
    nameBtn.hidden = false;
    save(K.profile, profile);
    renderProfile();
    refreshCards();
  }
  nameShow.addEventListener('click', startNameEdit);
  nameBtn.addEventListener('click', startNameEdit);
  nameEdit.addEventListener('blur', commitName);
  nameEdit.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); nameEdit.blur(); }
  });

  function startTagEdit() {
    taglineEdit.value = (profile.tagline || '') === '点一下，写一句自己的话。' ? '' : profile.tagline;
    taglineEdit.hidden = false;
    taglineShow.hidden = true;
    taglineEdit.focus();
    taglineEdit.select();
  }
  function commitTag() {
    var v = (taglineEdit.value || '').trim();
    profile.tagline = v;
    taglineEdit.hidden = true;
    taglineShow.hidden = false;
    save(K.profile, profile);
    renderProfile();
  }
  taglineShow.addEventListener('click', startTagEdit);
  taglineEdit.addEventListener('blur', commitTag);
  taglineEdit.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); taglineEdit.blur(); }
  });

  /* ==================== 卡片列表 ==================== */
  var CARDS = [
    { id: 'cord', idx: '01', tag: '单人', title: '耳机线', desc: '吃咖啡豆，把耳机线越养越长，别咬到自己。' },
    { id: 'whack', idx: '02', tag: '单人', title: '敲地鼠', desc: '三十秒，点掉冒头的小家伙，手快就加分。' },
    { id: 'claw', idx: '03', tag: '萌', title: '抓娃娃', desc: '一台毛绒娃娃机，挪好爪子按下去，抓一只上来。' },
    { id: 'fish', idx: '04', tag: '萌', title: '钓鱼', desc: '抛竿、等咬钩、一瞬间收线，钓到小黄鸭算你厉害。' },
    { id: 'jump', idx: '05', tag: '萌', title: '跳一跳', desc: '按住蓄力，松开就跳，落在下一块蛋糕上。' },
    { id: 'stack', idx: '06', tag: '萌', title: '叠饼干塔', desc: '饼干在滑，按下去只留重叠的部分，越叠越窄。' },
    { id: 'bubble', idx: '07', tag: '解压', title: '戳泡泡', desc: '没有计时，一屏慢慢飘的气泡，戳破还会响一声。' },
    { id: 'duel', idx: '08', tag: '双人', title: '双人对撞', desc: '两个人一台电脑，各自顶着对方的头像互相堵。' },
    { id: 'gomoku', idx: '09', tag: '双人', title: '五子棋', desc: '十一乘十一的棋盘，两个人轮流下，五子连珠。' },
    { id: 'tug', idx: '10', tag: '双人', title: '双人拔河', desc: '一个按 A 一个按 L，把红布拉过自己那条线。' },
    { id: 'memory', idx: '11', tag: '单人', title: '记忆翻牌', desc: '六到十对图案翻着找，看看几步能清空。' },
    { id: 'cards', idx: '12', tag: '互动', title: '抽卡字卡', desc: '给喜欢的角色做一套卡片，想 ta 的时候抽一张。' },
    { id: 'match', idx: '13', tag: '互动', title: '合拍卡', desc: '两张头像加一串项目，数值和文案都能自己写。' }
  ];

  function renderCards() {
    grid.innerHTML = '';
    CARDS.forEach(function (c) {
      var b = document.createElement('button');
      b.className = 'card';
      b.setAttribute('data-game', c.id);
      b.innerHTML =
        '<div class="card-top"><span class="idx">' + c.idx + '</span><span class="tag">' + c.tag + '</span></div>' +
        '<div class="card-title"></div><div class="card-desc"></div><div class="card-go">进入 →</div>';
      b.querySelector('.card-title').textContent = c.title;
      b.querySelector('.card-desc').textContent = c.desc;
      b.addEventListener('click', function () { openGame(c.id); });
      grid.appendChild(b);
    });
  }
  function refreshCards() { /* 卡片文案是静态的，这里只保留钩子 */ }


  /* ==================== 色调 ==================== */
  var THEMES = [
    { id: 'paper', name: '纸', paper: '#f2efe7', accent: '#b05a32' },
    { id: 'cream', name: '奶油', paper: '#f7f1e4', accent: '#c08050' },
    { id: 'sakura', name: '樱粉', paper: '#f8eef0', accent: '#c2687f' },
    { id: 'sky', name: '雾蓝', paper: '#eef2f4', accent: '#55809a' },
    { id: 'moss', name: '苔绿', paper: '#eff2ea', accent: '#6b8a5b' }
  ];
  var themeId = load(K.theme, 'paper');
  if (!THEMES.some(function (t) { return t.id === themeId; })) themeId = 'paper';

  function applyTheme(id, persist) {
    themeId = id;

  }

  })();

  /* ==================== 通用小工具 ==================== */
  function setupCanvas(cv, cols, rows, cell) {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = cols * cell * dpr;
    cv.height = rows * cell * dpr;
    cv.style.aspectRatio = cols + ' / ' + rows;
    var ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return ctx;
  }

  function drawAvatarHead(ctx, cx, cy, r, url, fallbackColor, ink) {
    var img = getImg(url);
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = fallbackColor;
    ctx.fill();
    if (img) {
      ctx.save();
      ctx.clip();
      var s = Math.max((r * 2) / img.width, (r * 2) / img.height);
      var w = img.width * s, h = img.height * s;
      ctx.drawImage(img, cx - w / 2, cy - h / 2, w, h);
      ctx.restore();
    }
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.lineWidth = 2;
    ctx.strokeStyle = ink || '#1d1b18';
    ctx.stroke();
    ctx.restore();
  }

  /* ==================== 01 耳机线 ==================== */
  function createCord(root) {
    root.innerHTML =
      '<div class="gbar">' +
        '<div class="stat"><span>分数</span><b class="js-score">0</b></div>' +
        '<div class="stat"><span>最高</span><b class="js-best">0</b></div>' +
      '</div>' +
      '<div class="rowline"><div class="js-diff"></div><button class="btn ghost mini js-ava" type="button">换头像</button></div>' +
      '<div class="board">' +
        '<canvas class="js-cv"></canvas>' +
        '<div class="ov js-ov">' +
          '<div class="ov-kicker js-k">ready</div>' +
          '<div class="ov-title js-t">耳机线</div>' +
          '<div class="ov-sub js-s"></div>' +
          '<button class="btn js-btn">开始（空格）</button>' +
        '</div>' +
      '</div>' +
      '<div class="hint"><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> / <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 转向，或直接点画面 · <kbd>空格</kbd> 开始 · <kbd>R</kbd> 重开</div>';

    var $ = function (s) { return root.querySelector(s); };
    var cv = $('.js-cv');
    var ov = $('.js-ov');
    var ovK = $('.js-k'), ovT = $('.js-t'), ovS = $('.js-s'), ovBtn = $('.js-btn');
    var elScore = $('.js-score'), elBest = $('.js-best');

    $('.js-diff').appendChild(diffBar('cord', function () { acc = 0; }));
    $('.js-ava').addEventListener('click', function () {
      pickImage(function (url) {
        profile.avatar = url;
        save(K.profile, profile);
        renderProfile();
      });
    });

    var COLS = 22, ROWS = 22, CELL = 26;
    var ctx = setupCanvas(cv, COLS, ROWS, CELL);

    var snake, dir, queue, food, bonus, grow, score, beans, best, newRecord;
    var state = 'ready', acc = 0, lastT = 0, raf = 0;
    var muted = false, actx = null;

    best = stats.cordBest || 0;
    elBest.textContent = best;

    function blip(freq) {
      if (muted) return;
      try {
        if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
        if (actx.state === 'suspended') actx.resume();
        var o = actx.createOscillator(), g = actx.createGain();
        o.type = 'sine'; o.frequency.value = freq; g.gain.value = 0.05;
        o.connect(g); g.connect(actx.destination);
        var t = actx.currentTime;
        o.start(t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
        o.stop(t + 0.14);
      } catch (e) {}
    }

    function freeCell() {
      var used = {}, i;
      for (i = 0; i < snake.length; i++) used[snake[i].x + ',' + snake[i].y] = 1;
      if (food) used[food.x + ',' + food.y] = 1;
      if (bonus) used[bonus.x + ',' + bonus.y] = 1;
      var pool = [];
      for (var y = 0; y < ROWS; y++) {
        for (var x = 0; x < COLS; x++) if (!used[x + ',' + y]) pool.push({ x: x, y: y });
      }
      return pool.length ? pool[Math.floor(Math.random() * pool.length)] : null;
    }

    function reset() {
      snake = [{ x: 9, y: 11 }, { x: 8, y: 11 }, { x: 7, y: 11 }, { x: 6, y: 11 }, { x: 5, y: 11 }];
      dir = { x: 1, y: 0 };
      queue = []; grow = 0; score = 0; beans = 0; bonus = null; newRecord = false; acc = 0;
      var c = freeCell();
      food = c ? { x: c.x, y: c.y } : null;
      elScore.textContent = '0';
    }

    function showOv(kind) {
      if (kind === 'ready') {
        ovK.textContent = 'ready'; ovT.textContent = '把线养长';
        ovS.textContent = '吃咖啡豆加分，每 5 颗冒一杯奶茶。别咬到自己的耳机线。';
        ovBtn.textContent = '开始（空格）';
      } else if (kind === 'over') {
        ovK.textContent = 'game over'; ovT.textContent = '线断了';
        ovS.textContent = (newRecord ? '新纪录 · ' : '') + '这局 ' + score + ' 分，最高 ' + best + ' 分。';
        ovBtn.textContent = '再来一局（R）';
      } else {
        ovK.textContent = 'paused'; ovT.textContent = '暂停中';
        ovS.textContent = '按空格继续。';
        ovBtn.textContent = '继续（空格）';
      }
      ov.hidden = false;
    }

    function start() {
      reset();
      state = 'playing';
      ov.hidden = true;
      blip(520);
    }
    function resume() { state = 'playing'; acc = 0; ov.hidden = true; }
    function pause() { if (state !== 'playing') return; state = 'paused'; showOv('paused'); }
    function isPlaying() { return state === 'playing'; }

    function die() {
      state = 'over';
      if (score > best) {
        best = score; newRecord = true;
        stats.cordBest = best;
        save(K.stats, stats);
      }
      elBest.textContent = best;
      blip(170);
      showOv('over');
    }

    function speed() {
      var base = { easy: 195, normal: 132, hard: 98 };
      var floor = { easy: 128, normal: 74, hard: 55 };
      var drop = { easy: 4, normal: 8, hard: 11 };
      var d = diffOf('cord');
      var b = base[d] || base.easy;
      var m = floor[d] || floor.easy;
      var s = drop[d] || drop.easy;
      var lv = 1 + Math.floor(score / 100);
      return Math.max(m, b - (lv - 1) * s);
    }

    function step() {
      if (queue.length) {
        var nd = queue.shift();
        if (!(nd.x === -dir.x && nd.y === -dir.y)) dir = nd;
      }
      var h = snake[0];
      var nx = h.x + dir.x, ny = h.y + dir.y;
      if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) return die();
      var limit = grow > 0 ? snake.length : snake.length - 1;
      for (var i = 0; i < limit; i++) if (snake[i].x === nx && snake[i].y === ny) return die();

      snake.unshift({ x: nx, y: ny });
      if (grow > 0) grow--; else snake.pop();

      if (food && nx === food.x && ny === food.y) {
        score += 10; beans += 1; grow += 1;
        elScore.textContent = score;
        var c = freeCell();
        food = c ? { x: c.x, y: c.y } : null;
        if (beans % 5 === 0) {
          var b = freeCell();
          if (b) bonus = { x: b.x, y: b.y, born: performance.now() };
        }
        blip(660);
      }
      if (bonus && nx === bonus.x && ny === bonus.y) {
        score += 50; bonus = null;
        elScore.textContent = score;
        blip(880);
      }
    }

    function dots() {
      ctx.fillStyle = 'rgba(29,27,24,.07)';
      for (var y = 0; y < ROWS; y++) {
        for (var x = 0; x < COLS; x++) {
          ctx.beginPath();
          ctx.arc(x * CELL + CELL / 2, y * CELL + CELL / 2, 1.1, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    function cord() {
      if (!snake.length) return;
      var path = function () {
        ctx.beginPath();
        for (var i = 0; i < snake.length; i++) {
          var px = snake[i].x * CELL + CELL / 2, py = snake[i].y * CELL + CELL / 2;
          if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
      };
      ctx.save();
      ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      path(); ctx.strokeStyle = '#1d1b18'; ctx.lineWidth = CELL * 0.6; ctx.stroke();
      path(); ctx.strokeStyle = '#fdfbf5'; ctx.lineWidth = CELL * 0.46; ctx.stroke();
      path(); ctx.strokeStyle = 'rgba(29,27,24,.16)'; ctx.lineWidth = CELL * 0.05; ctx.stroke();
      var t = snake[snake.length - 1];
      ctx.beginPath();
      ctx.arc(t.x * CELL + CELL / 2, t.y * CELL + CELL / 2, CELL * 0.16, 0, Math.PI * 2);
      ctx.fillStyle = '#c9c2b4'; ctx.fill();
      ctx.lineWidth = 1.5; ctx.strokeStyle = '#1d1b18'; ctx.stroke();
      ctx.restore();
    }

    function head() {
      var h = snake[0];
      var cx = h.x * CELL + CELL / 2, cy = h.y * CELL + CELL / 2, r = CELL * 0.44;
      var img = getImg(profile.avatar);
      if (img) { drawAvatarHead(ctx, cx, cy, r, profile.avatar, '#f8ddc6'); return; }
      ctx.save();
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fillStyle = '#f8ddc6'; ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = '#1d1b18'; ctx.stroke();
      ctx.beginPath();
      ctx.arc(cx, cy, r - 1, Math.PI, Math.PI * 2);
      ctx.lineTo(cx + r - 1, cy - r * 0.1);
      ctx.lineTo(cx - r + 1, cy - r * 0.1);
      ctx.closePath();
      ctx.fillStyle = '#241f1a'; ctx.fill();
      var ex = dir.x * r * 0.1, ey = dir.y * r * 0.1;
      ctx.fillStyle = '#1d1b18';
      ctx.beginPath(); ctx.arc(cx - r * 0.32 + ex, cy + r * 0.06 + ey, r * 0.115, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + r * 0.32 + ex, cy + r * 0.06 + ey, r * 0.115, 0, Math.PI * 2); ctx.fill();
      var bx = dir.x >= 0 ? cx - r : cx + r;
      ctx.beginPath(); ctx.arc(bx, cy + r * 0.05, r * 0.2, 0, Math.PI * 2);
      ctx.fillStyle = '#1d1b18'; ctx.fill();
      ctx.restore();
    }

    function bean() {
      if (!food) return;
      var cx = food.x * CELL + CELL / 2, cy = food.y * CELL + CELL / 2;
      ctx.save();
      ctx.translate(cx, cy); ctx.rotate(-0.45);
      ctx.beginPath(); ctx.ellipse(0, 0, CELL * 0.27, CELL * 0.35, 0, 0, Math.PI * 2);
      ctx.fillStyle = '#4a3527'; ctx.fill();
      ctx.lineWidth = 1.6; ctx.strokeStyle = '#1d1b18'; ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, -CELL * 0.25);
      ctx.quadraticCurveTo(CELL * 0.085, 0, 0, CELL * 0.25);
      ctx.lineWidth = 1.6; ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.stroke();
      ctx.restore();
    }

    function cup() {
      if (!bonus) return;
      var cx = bonus.x * CELL + CELL / 2, cy = bonus.y * CELL + CELL / 2;
      var w = CELL * 0.24, hh = CELL * 0.34;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.beginPath();
      ctx.moveTo(-w, -hh * 0.7); ctx.lineTo(w, -hh * 0.7);
      ctx.lineTo(w * 0.72, hh * 0.95); ctx.lineTo(-w * 0.72, hh * 0.95);
      ctx.closePath();
      ctx.fillStyle = '#e8c9a8'; ctx.fill();
      ctx.lineWidth = 1.6; ctx.strokeStyle = '#1d1b18'; ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-w * 0.9, -hh * 0.15); ctx.lineTo(w * 0.9, -hh * 0.15);
      ctx.lineTo(w * 0.78, hh * 0.55); ctx.lineTo(-w * 0.78, hh * 0.55);
      ctx.closePath();
      ctx.fillStyle = '#b9895e'; ctx.fill();
      ctx.fillStyle = '#2b2320';
      ctx.beginPath(); ctx.arc(-w * 0.34, hh * 0.35, CELL * 0.055, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(w * 0.06, hh * 0.42, CELL * 0.055, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(w * 0.4, hh * 0.28, CELL * 0.05, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(w * 0.34, -hh * 0.7); ctx.lineTo(w * 0.56, -hh * 1.5);
      ctx.lineWidth = 2.6; ctx.strokeStyle = '#1d1b18'; ctx.stroke();
      ctx.restore();
    }

    function draw() {
      ctx.clearRect(0, 0, COLS * CELL, ROWS * CELL);
      dots(); cord(); bean(); cup(); head();
    }

    function frame(now) {
      if (!lastT) lastT = now;
      var dt = now - lastT; lastT = now;
      if (dt > 250) dt = 250;
      if (state === 'playing') {
        acc += dt;
        var iv = speed(), guard = 0;
        while (acc >= iv && state === 'playing' && guard < 6) { acc -= iv; step(); guard++; }
      } else {
        acc = 0;
      }
      if (bonus && now - bonus.born > 8000) bonus = null;
      draw();
      raf = window.requestAnimationFrame(frame);
    }

    function push(d) {
      if (state !== 'playing') return;
      var last = queue.length ? queue[queue.length - 1] : dir;
      if (d.x === -last.x && d.y === -last.y) return;
      if (d.x === last.x && d.y === last.y) return;
      if (queue.length < 2) queue.push(d);
    }

    function onKey(e) {
      var k = (e.key || '').toLowerCase();
      if (k === ' ' || e.code === 'Space') {
        e.preventDefault();
        if (state === 'ready' || state === 'over') start();
        else if (state === 'paused') resume();
        return;
      }
      if (k === 'r') { e.preventDefault(); start(); return; }
      if (k === 'm') { muted = !muted; return; }
      var d = null;
      if (k === 'arrowup' || k === 'w') d = { x: 0, y: -1 };
      else if (k === 'arrowdown' || k === 's') d = { x: 0, y: 1 };
      else if (k === 'arrowleft' || k === 'a') d = { x: -1, y: 0 };
      else if (k === 'arrowright' || k === 'd') d = { x: 1, y: 0 };
      if (d) {
        e.preventDefault();
        if (state === 'ready' || state === 'over') start();
        push(d);
      }
    }

    cv.addEventListener('pointerdown', function (e) {
      if (state !== 'playing') {
        if (state === 'ready' || state === 'over') start();
        return;
      }
      var r = cv.getBoundingClientRect();
      if (!r.width) return;
      var gx = (e.clientX - r.left) / r.width * COLS;
      var gy = (e.clientY - r.top) / r.height * ROWS;
      var h = snake[0];
      var dx = gx - (h.x + 0.5), dy = gy - (h.y + 0.5);
      if (Math.abs(dx) >= Math.abs(dy)) {
        if (Math.abs(dx) > 0.05) push({ x: dx > 0 ? 1 : -1, y: 0 });
      } else if (Math.abs(dy) > 0.05) {
        push({ x: 0, y: dy > 0 ? 1 : -1 });
      }
    });

    ovBtn.addEventListener('click', function () {
      if (state === 'ready' || state === 'over') start();
      else if (state === 'paused') resume();
    });

    window.addEventListener('keydown', onKey);
    reset();
    showOv('ready');
    raf = window.requestAnimationFrame(frame);

    return {
      teardown: function () {
        window.cancelAnimationFrame(raf);
        window.removeEventListener('keydown', onKey);
      },
      pause: pause,
      resume: resume,
      isPlaying: isPlaying
    };
  }

    var players, foods, state, raf = 0, lastT = 0, acc = 0, countdownEnd = 0, winner = '';

    function paintLobby() {
      n1.textContent = profile.name;
      n2.textContent = rival.name || '对面';
      a1.textContent = (profile.name || '我').slice(0, 1);
      a2.textContent = (rival.name || '对').slice(0, 1);
      if (profile.avatar) { a1.style.backgroundImage = 'url(' + profile.avatar + ')'; a1.textContent = ''; }
      else a1.style.backgroundImage = '';
      if (rival.avatar) { a2.style.backgroundImage = 'url(' + rival.avatar + ')'; a2.textContent = ''; }
      else a2.style.backgroundImage = '';
      preload(profile.avatar);
      preload(rival.avatar);
    }

    function makeSnake(x, y, dx, color, avatar, name) {
      return {
        cells: [{ x: x, y: y }, { x: x - dx, y: y }, { x: x - dx * 2, y: y }],
        dir: { x: dx, y: 0 },
        queue: [],
        grow: 0,
        score: 0,
        alive: true,
        color: color,
        avatar: avatar,
        name: name
      };
    }

    function reset() {
      players = [
        makeSnake(3, 7, 1, '#1d1b18', profile.avatar, profile.name),
        makeSnake(COLS - 4, 7, -1, '#5b7b8c', rival.avatar, rival.name || '对面')
      ];
      foods = [];
      for (var i = 0; i < 2; i++) {
        var c = freeCell();
        if (c) foods.push(c);
      }
      state = 'countdown';
      acc = 0;
      countdownEnd = performance.now() + 1600;
      winner = '';
      ov.hidden = true;
    }

    function occupied(x, y) {
      for (var p = 0; p < players.length; p++) {
        var s = players[p].cells;
        for (var i = 0; i < s.length; i++) if (s[i].x === x && s[i].y === y) return true;
      }
      return false;
    }

    function freeCell() {
      var pool = [];
      for (var y = 0; y < ROWS; y++) {
        for (var x = 0; x < COLS; x++) {
          if (occupied(x, y)) continue;
          var taken = false;
          for (var f = 0; f < foods.length; f++) if (foods[f].x === x && foods[f].y === y) taken = true;
          if (!taken) pool.push({ x: x, y: y });
        }
      }
      return pool.length ? pool[Math.floor(Math.random() * pool.length)] : null;
    }

    function step() {
      var heads = [], i, p;
      for (p = 0; p < players.length; p++) {
        var pl = players[p];
        if (!pl.alive) { heads.push(null); continue; }
        if (pl.queue.length) {
          var nd = pl.queue.shift();
          if (!(nd.x === -pl.dir.x && nd.y === -pl.dir.y)) pl.dir = nd;
        }
        heads.push({ x: pl.cells[0].x + pl.dir.x, y: pl.cells[0].y + pl.dir.y });
      }

      var dead = [false, false];
      for (p = 0; p < players.length; p++) {
        var h = heads[p];
        if (!h || !players[p].alive) continue;
        if (h.x < 0 || h.y < 0 || h.x >= COLS || h.y >= ROWS) dead[p] = true;
      }
      // 头对头
      if (heads[0] && heads[1] && heads[0].x === heads[1].x && heads[0].y === heads[1].y) {
        dead[0] = dead[1] = true;
      }
      // 撞身体（尾巴会移开，所以不算）
      for (p = 0; p < players.length; p++) {
        var hh = heads[p];
        if (!hh || dead[p]) continue;
        for (var q = 0; q < players.length; q++) {
          var cells = players[q].cells;
          var upto = cells.length - 1;
          for (i = 0; i < upto; i++) {
            if (cells[i].x === hh.x && cells[i].y === hh.y) dead[p] = true;
          }
        }
      }

      if (dead[0] || dead[1]) { endRound(dead); return; }

      for (p = 0; p < players.length; p++) {
        var s = players[p];
        s.cells.unshift(heads[p]);
        if (s.grow > 0) s.grow--; else s.cells.pop();
        for (var f = foods.length - 1; f >= 0; f--) {
          if (heads[p].x === foods[f].x && heads[p].y === foods[f].y) {
            s.score += 1;
            s.grow += 1;
            foods.splice(f, 1);
            var c = freeCell();
            if (c) foods.push(c);
          }
        }
      }
    }

    function endRound(dead) {
      var bothDead = dead[0] && dead[1];
      if (!bothDead && dead[0] && !dead[1]) {
        winner = players[1].name;
        stats.duelL = (stats.duelL || 0) + 1;
        stats.duelW = stats.duelW || 0;
      } else if (!bothDead && dead[1] && !dead[0]) {
        winner = players[0].name;
        stats.duelW = (stats.duelW || 0) + 1;
        stats.duelL = stats.duelL || 0;
      } else {
        winner = '平局';
      }
      save(K.stats, stats);

      state = 'over';
      ovK.textContent = 'round over';
      ovT.textContent = bothDead ? '两个人一起撞了' : winner + ' 赢';
      ovS.textContent = players[0].name + ' 吃到 ' + players[0].score + ' 颗 · ' + players[1].name + ' 吃到 ' + players[1].score + ' 颗';
      ov.hidden = false;
      updateHint();
    }

    function updateHint() {
      hint.innerHTML = '比分 <b>' + stats.duelW + ' : ' + stats.duelL + '</b> · 左（<kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>）· 右（<kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd>）';
    }

    function dots() {
      ctx.fillStyle = 'rgba(29,27,24,.07)';
      for (var y = 0; y < ROWS; y++) {
        for (var x = 0; x < COLS; x++) {
          ctx.beginPath();
          ctx.arc(x * CELL + CELL / 2, y * CELL + CELL / 2, 1.1, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    function drawSnake(p, idx) {
      var path = function () {
        ctx.beginPath();
        for (var i = 0; i < p.cells.length; i++) {
          var px = p.cells[i].x * CELL + CELL / 2, py = p.cells[i].y * CELL + CELL / 2;
          if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
      };
      ctx.save();
      ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      path(); ctx.strokeStyle = idx === 0 ? 'rgba(29,27,24,.28)' : 'rgba(91,123,140,.35)';
      ctx.lineWidth = CELL * 0.6; ctx.stroke();
      path(); ctx.strokeStyle = idx === 0 ? '#fdfbf5' : '#eef3f5';
      ctx.lineWidth = CELL * 0.44; ctx.stroke();
      if (!p.alive) ctx.globalAlpha = 0.45;
      var h = p.cells[0];
      drawAvatarHead(ctx, h.x * CELL + CELL / 2, h.y * CELL + CELL / 2, CELL * 0.42, p.avatar, idx === 0 ? '#f8ddc6' : '#dbe6ea', idx === 0 ? '#1d1b18' : '#41586a');
      ctx.restore();
    }

    function draw() {
      ctx.clearRect(0, 0, COLS * CELL, ROWS * CELL);
      dots();
      for (var i = 0; i < players.length; i++) {
        if (players[i].cells.length) drawSnake(players[i], i);
      }
      ctx.save();
      for (var f = 0; f < foods.length; f++) {
        var cx = foods[f].x * CELL + CELL / 2, cy = foods[f].y * CELL + CELL / 2;
        ctx.save();
        ctx.translate(cx, cy); ctx.rotate(-0.45);
        ctx.beginPath(); ctx.ellipse(0, 0, CELL * 0.24, CELL * 0.31, 0, 0, Math.PI * 2);
        ctx.fillStyle = '#4a3527'; ctx.fill();
        ctx.lineWidth = 1.5; ctx.strokeStyle = '#1d1b18'; ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, -CELL * 0.22);
        ctx.quadraticCurveTo(CELL * 0.075, 0, 0, CELL * 0.22);
        ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.stroke();
        ctx.restore();
      }
      ctx.restore();

      if (state === 'countdown') {
        var left = Math.max(0, countdownEnd - performance.now());
        var label = left > 800 ? '3' : left > 400 ? '2' : '1';
        ctx.save();
        ctx.fillStyle = 'rgba(29,27,24,.75)';
        ctx.font = '600 64px ui-monospace,Menlo,monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(label, COLS * CELL / 2, ROWS * CELL / 2);
        ctx.restore();
      }
    }

    function frame(now) {
      if (!lastT) lastT = now;
      var dt = now - lastT; lastT = now;
      if (dt > 200) dt = 200;

      if (state === 'countdown' && performance.now() >= countdownEnd) {
        state = 'playing';
        acc = 0;
      }
      if (state === 'playing') {
        acc += dt;
        var iv = DUEL_SPEED[diffOf('duel')] || 118, guard = 0;
        while (acc >= iv && state === 'playing' && guard < 4) { acc -= iv; step(); guard++; }
      }
      draw();
      raf = window.requestAnimationFrame(frame);
    }

    function push(idx, d) {
      var p = players[idx];
      if (!p || !p.alive || state !== 'playing') return;
      var last = p.queue.length ? p.queue[p.queue.length - 1] : p.dir;
      if (d.x === -last.x && d.y === -last.y) return;
      if (d.x === last.x && d.y === last.y) return;
      if (p.queue.length < 2) p.queue.push(d);
    }

    function onKey(e) {
      if (e.key === ' ') {
        if (state === 'over') { e.preventDefault(); beginRound(); }
        return;
      }
      if (state !== 'playing') return;
      var k = (e.key || '').toLowerCase();
      var handled = true;
      if (k === 'w') push(0, { x: 0, y: -1 });
      else if (k === 's') push(0, { x: 0, y: 1 });
      else if (k === 'a') push(0, { x: -1, y: 0 });
      else if (k === 'd') push(0, { x: 1, y: 0 });
      else if (k === 'arrowup') push(1, { x: 0, y: -1 });
      else if (k === 'arrowdown') push(1, { x: 0, y: 1 });
      else if (k === 'arrowleft') push(1, { x: -1, y: 0 });
      else if (k === 'arrowright') push(1, { x: 1, y: 0 });
      else handled = false;
      if (handled) e.preventDefault();
    }

    function beginRound() {
      lobby.hidden = true;
      board.hidden = false;
      hint.hidden = false;
      var padsEl = document.querySelector('.js-pads');
      if (padsEl) padsEl.hidden = false;
      reset();
      updateHint();
      preload(profile.avatar);
      preload(rival.avatar);
    }

    function pause() { if (state === 'playing' || state === 'countdown') { state = 'pausedPrev'; } }
    function resume() { if (state === 'pausedPrev') state = 'playing'; }
    function isPlaying() { return state === 'playing' || state === 'countdown'; }

    (function bindPads() {
      [0, 1].forEach(function (idx) {
        var host = document.querySelector('.js-pad' + idx);
        if (!host) return;
        var map = {
          up: { x: 0, y: -1 }, down: { x: 0, y: 1 },
          left: { x: -1, y: 0 }, right: { x: 1, y: 0 }
        };
        host.addEventListener('pointerdown', function (e) {
          var b = e.target.closest('button[data-d]');
          if (!b) return;
          e.preventDefault();
          if (state !== 'playing') return;
          var d = map[b.getAttribute('data-d')];
          if (d) push(idx, d);
        });
      });
    })();

    $('.js-start').addEventListener('click', beginRound);
    $('.js-again').addEventListener('click', beginRound);
    $('.js-pick').addEventListener('click', function () {
      pickImage(function (url) {
        rival.avatar = url;
        save(K.rival, rival);
        paintLobby();
      });
    });

    window.addEventListener('keydown', onKey);

    paintLobby();
    players = [
      makeSnake(3, 7, 1, '#1d1b18', profile.avatar, profile.name),
      makeSnake(COLS - 4, 7, -1, '#5b7b8c', rival.avatar, rival.name || '对面')
    ];
    foods = [];
    state = 'lobby';
    updateHint();
    raf = window.requestAnimationFrame(frame);

    return {
      teardown: function () {
        window.cancelAnimationFrame(raf);
        window.removeEventListener('keydown', onKey);
      },
      pause: pause,
      resume: resume,
      isPlaying: isPlaying
    };
  }

  /* ==================== 03 记忆翻牌 ==================== */
  function createMemory(root) {
    var GLYPHS = ['✦', '✳', '●', '▲', '◆', '✿', '☾', '✕', '❖', '◐', '✚', '◒'];
    var state = { cards: [], first: -1, lock: false, moves: 0, matched: 0 };

    root.innerHTML =
      '<div class="mem-wrap">' +
        '<div class="mem-bar"><span>步数 <b class="js-moves">0</b></span><span>最佳 <b class="js-best">—</b></span></div>' +
        '<div class="js-diff" style="margin-bottom:10px"></div>' +
        '<div class="mem-grid js-grid"></div>' +
        '<div class="hint">点两张翻过来，图案一样就留下。用最少的步数清空。</div>' +
      '</div>';

    var $ = function (s) { return root.querySelector(s); };
    var gridEl = $('.js-grid'), movesEl = $('.js-moves'), bestEl = $('.js-best');

    bestEl.textContent = memBestVal() ? memBestVal() + ' 步' : '—';
    var PAIRS = { easy: 6, normal: 8, hard: 10 };
    $('.js-diff').appendChild(diffBar('memory', function () {
      bestEl.textContent = memBestVal() ? memBestVal() + ' 步' : '—';
      deal();
    }));

    function deal() {
      var deck = [];
      var pairs = PAIRS[diffOf('memory')] || 6;
      GLYPHS.slice(0, pairs).forEach(function (g) { deck.push(g); deck.push(g); });
      for (var i = deck.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
      }
      state = { cards: deck, first: -1, lock: false, moves: 0, matched: 0, pairs: pairs };
      movesEl.textContent = '0';
      gridEl.innerHTML = '';
      deck.forEach(function (g, idx) {
        var b = document.createElement('button');
        b.className = 'mcard';
        b.setAttribute('data-i', String(idx));
        b.innerHTML = '<span>' + g + '</span>';
        b.addEventListener('click', function () { flip(idx, b); });
        gridEl.appendChild(b);
      });
    }

    function flip(idx, el) {
      if (state.lock) return;
      if (el.classList.contains('up') || el.classList.contains('done')) return;
      el.classList.add('up');

      if (state.first < 0) { state.first = idx; return; }

      var firstIdx = state.first;
      var firstEl = gridEl.querySelector('[data-i="' + firstIdx + '"]');
      state.moves += 1;
      movesEl.textContent = String(state.moves);

      if (state.cards[firstIdx] === state.cards[idx]) {
        el.classList.add('done');
        if (firstEl) firstEl.classList.add('done');
        state.matched += 1;
        state.first = -1;
        if (state.matched === state.pairs) win();
      } else {
        state.lock = true;
        state.first = -1;
        window.setTimeout(function () {
          el.classList.remove('up');
          if (firstEl) firstEl.classList.remove('up');
          state.lock = false;
        }, 620);
      }
    }

    function win() {
      stats.memBest = (typeof stats.memBest === 'number') ? { normal: stats.memBest } : (stats.memBest || {});
      var dk = diffOf('memory');
      if (!stats.memBest[dk] || state.moves < stats.memBest[dk]) {
        stats.memBest[dk] = state.moves;
        save(K.stats, stats);
        bestEl.textContent = state.moves + ' 步';
      }
      var ov = document.createElement('div');
      ov.className = 'ov';
      ov.innerHTML =
        '<div class="ov-kicker">clear</div>' +
        '<div class="ov-title">全部找到了</div>' +
        '<div class="ov-sub">用了 ' + state.moves + ' 步 · 最佳 ' + (stats.memBest[dk] || state.moves) + ' 步</div>' +
        '<button class="btn">再来一局</button>';
      ov.querySelector('.btn').addEventListener('click', function () { ov.remove(); deal(); });
      root.querySelector('.mem-wrap').appendChild(ov);
    }

    deal();

    return {
      teardown: function () {},
      pause: function () {},
      resume: function () {},
      isPlaying: function () { return false; }
    };
  }

  /* ==================== 02 敲地鼠 ==================== */
  function createWhack(root) {
    root.innerHTML =
      '<div class="gbar">' +
        '<div class="stat"><span>分数</span><b class="js-score">0</b></div>' +
        '<div class="stat"><span>最高</span><b class="js-best">0</b></div>' +
        '<div class="stat"><span>剩余（秒）</span><b class="js-time">30</b></div>' +
      '</div>' +
      '<div class="rowline"><div class="js-diff"></div><span class="tip js-combo"></span></div>' +
      '<div class="board">' +
        '<canvas class="js-cv"></canvas>' +
        '<div class="ov js-ov">' +
          '<div class="ov-kicker js-k">ready</div>' +
          '<div class="ov-title js-t">敲地鼠</div>' +
          '<div class="ov-sub js-s"></div>' +
          '<button class="btn js-btn">开始（30 秒）</button>' +
        '</div>' +
      '</div>' +
      '<div class="hint">冒头就点，手慢它就缩回去了；点空会断连击，连得越多分越高。</div>';

    var $ = function (s) { return root.querySelector(s); };
    var cv = $('.js-cv');
    var ov = $('.js-ov'), ovK = $('.js-k'), ovT = $('.js-t'), ovS = $('.js-s'), ovBtn = $('.js-btn');
    var elScore = $('.js-score'), elBest = $('.js-best'), elTime = $('.js-time'), elCombo = $('.js-combo');

    var COLS = 3, ROWS = 3, CELL = 180;
    var ctx = setupCanvas(cv, COLS, ROWS, CELL);
    var TOTAL = 30000;

    var CFG = {
      easy: { spawn: 950, dwell: 1550, max: 2 },
      normal: { spawn: 700, dwell: 1050, max: 2 },
      hard: { spawn: 470, dwell: 760, max: 3 }
    };

    var state = 'ready', raf = 0, moles = [], score = 0, combo = 0, best;
    var endAt = 0, lastSpawn = 0, lastT = 0, newRecord = false;

    best = stats.whackBest || 0;
    elBest.textContent = best;
    $('.js-diff').appendChild(diffBar('whack', function () { updateHud(); }));

    function cfg() { return CFG[diffOf('whack')] || CFG.easy; }

    function updateHud() {
      elScore.textContent = score;
      elCombo.textContent = combo >= 3 ? '连击 ' + combo : '';
    }

    function reset() {
      moles = []; score = 0; combo = 0; newRecord = false;
      lastSpawn = 0; lastT = 0;
      endAt = performance.now() + TOTAL;
      elTime.textContent = '30';
      updateHud();
    }

    function showOv(kind) {
      if (kind === 'ready') {
        ovK.textContent = 'ready'; ovT.textContent = '敲地鼠';
        ovS.textContent = '30 秒内点掉冒头的小家伙。点空会断连击。';
        ovBtn.textContent = '开始（30 秒）';
      } else {
        ovK.textContent = 'time up'; ovT.textContent = score + ' 下';
        ovS.textContent = (newRecord ? '新纪录 · ' : '') + '最高 ' + best + ' 下。';
        ovBtn.textContent = '再来一局';
      }
      ov.hidden = false;
    }

    function start() {
      reset();
      state = 'playing';
      ov.hidden = true;
      spawn(performance.now());
    }

    function finish() {
      state = 'over';
      if (score > best) { best = score; newRecord = true; stats.whackBest = best; save(K.stats, stats); }
      elBest.textContent = best;
      showOv('over');
    }

    function spawn(now) {
      var c = cfg();
      if (moles.length >= c.max) return;
      var taken = {};
      for (var i = 0; i < moles.length; i++) taken[moles[i].i + ',' + moles[i].j] = 1;
      var pool = [];
      for (var y = 0; y < ROWS; y++) {
        for (var x = 0; x < COLS; x++) if (!taken[x + ',' + y]) pool.push({ i: x, j: y });
      }
      if (!pool.length) return;
      var p = pool[Math.floor(Math.random() * pool.length)];
      moles.push({ i: p.i, j: p.j, born: now, dwell: c.dwell, hit: 0 });
    }

    function hitAt(x, y) {
      if (state !== 'playing') return;
      var idx = -1;
      for (var i = 0; i < moles.length; i++) {
        if (moles[i].i === x && moles[i].j === y && !moles[i].hit) idx = i;
      }
      if (idx < 0) { combo = 0; updateHud(); return; }
      var m = moles[idx];
      m.hit = performance.now();
      combo += 1;
      var pts = 1 + (combo >= 5 ? 1 : 0) + (combo >= 10 ? 1 : 0);
      score += pts;
      updateHud();
      window.setTimeout(function () {
        for (var k = 0; k < moles.length; k++) if (moles[k] === m) { moles.splice(k, 1); break; }
      }, 140);
    }

    function dotGrid() {
      ctx.fillStyle = 'rgba(29,27,24,.06)';
      for (var y = 0; y < ROWS; y++) {
        for (var x = 0; x < COLS; x++) {
          ctx.beginPath();
          ctx.arc(x * CELL + CELL / 2, y * CELL + CELL / 2 - 40, 1.4, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    function hole(cx, cy) {
      ctx.beginPath();
      ctx.ellipse(cx, cy + 3, CELL * 0.33, CELL * 0.12, 0, 0, Math.PI * 2);
      ctx.fillStyle = '#e2d9c7';
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(cx, cy, CELL * 0.33, CELL * 0.12, 0, 0, Math.PI * 2);
      ctx.fillStyle = '#ece5d6';
      ctx.fill();
      ctx.lineWidth = 1.6;
      ctx.strokeStyle = '#d3c9b4';
      ctx.stroke();
      ctx.beginPath();
      ctx.ellipse(cx, cy, CELL * 0.31, CELL * 0.11, 0, Math.PI * 1.08, Math.PI * 1.92);
      ctx.strokeStyle = '#c7bda4';
      ctx.lineWidth = 2.4;
      ctx.stroke();
    }

    function mole(m, now) {
      var cx = m.i * CELL + CELL / 2;
      var cy = m.j * CELL + CELL / 2 + CELL * 0.16;
      var age = now - m.born;
      var p = Math.min(1, age / 140);
      if (m.hit) {
        var hp = Math.min(1, (now - m.hit) / 140);
        p = 1 - hp;
      } else if (m.dwell - age < 200) {
        p = Math.max(0, (m.dwell - age) / 200);
      }
      if (p <= 0.02) return;
      var r = CELL * 0.21;
      var rise = p * CELL * 0.2;
      ctx.save();
      ctx.beginPath();
      ctx.rect(m.i * CELL, m.j * CELL, CELL, CELL * 0.5 + CELL * 0.16);
      ctx.clip();
      ctx.translate(cx, cy - rise);
      // 耳朵
      ctx.fillStyle = m.hit ? '#cf9b7c' : '#6f5138';
      ctx.beginPath(); ctx.arc(-r * 0.78, -r * 0.7, r * 0.36, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(r * 0.78, -r * 0.7, r * 0.36, 0, Math.PI * 2); ctx.fill();
      // 身体
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.fillStyle = m.hit ? '#e0b193' : '#7b5a43';
      ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = '#1d1b18'; ctx.stroke();
      // 嘴
      ctx.beginPath();
      ctx.ellipse(0, r * 0.42, r * 0.46, r * 0.32, 0, 0, Math.PI * 2);
      ctx.fillStyle = m.hit ? '#f4d7c2' : '#d8c3ae';
      ctx.fill();
      // 眼
      ctx.fillStyle = '#1d1b18';
      ctx.beginPath(); ctx.arc(-r * 0.34, -r * 0.1, r * 0.11, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(r * 0.34, -r * 0.1, r * 0.11, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    function draw(now) {
      ctx.clearRect(0, 0, COLS * CELL, ROWS * CELL);
      dotGrid();
      for (var y = 0; y < ROWS; y++) {
        for (var x = 0; x < COLS; x++) hole(x * CELL + CELL / 2, y * CELL + CELL / 2 + CELL * 0.16);
      }
      for (var i = 0; i < moles.length; i++) mole(moles[i], now);
    }

    function frame(now) {
      if (!lastT) lastT = now;
      var dt = now - lastT; lastT = now;
      if (dt > 250) dt = 250;

      if (state === 'playing') {
        var c = cfg();
        if (!lastSpawn) lastSpawn = now;
        if (now - lastSpawn >= c.spawn) { lastSpawn = now; spawn(now); }
        for (var i = moles.length - 1; i >= 0; i--) {
          if (!moles[i].hit && now - moles[i].born > moles[i].dwell) moles.splice(i, 1);
        }
        var left = Math.max(0, Math.ceil((endAt - now) / 1000));
        elTime.textContent = String(left);
        if (left <= 0) finish();
      }
      draw(now);
      raf = window.requestAnimationFrame(frame);
    }

    cv.addEventListener('pointerdown', function (e) {
      if (state !== 'playing') return;
      var r = cv.getBoundingClientRect();
      if (!r.width) return;
      var x = Math.floor((e.clientX - r.left) / r.width * COLS);
      var y = Math.floor((e.clientY - r.top) / r.height * ROWS);
      x = Math.max(0, Math.min(COLS - 1, x));
      y = Math.max(0, Math.min(ROWS - 1, y));
      hitAt(x, y);
    });

    ovBtn.addEventListener('click', start);

    function onKey(e) {
      if (e.key === ' ') {
        if (state === 'ready' || state === 'over') { e.preventDefault(); start(); }
      }
    }
    window.addEventListener('keydown', onKey);

    showOv('ready');
    raf = window.requestAnimationFrame(frame);

    return {
      teardown: function () {
        window.cancelAnimationFrame(raf);
        window.removeEventListener('keydown', onKey);
      },
      pause: function () { if (state === 'playing') state = 'pausedPrev'; },
      resume: function () { if (state === 'pausedPrev') state = 'playing'; },
      isPlaying: function () { return state === 'playing'; }
    };
  }

  /* ==================== 04 合拍卡 ==================== */
  function createMatch(root) {
    var W = 960, H = 660;

    var QUOTES = [
      [0, ['还在互相摸底，慢慢来也挺好。', '两个不同频道的人，正在调频。']],
      [60, ['步调不太一致，但笑点很齐。', '一个负责想，一个负责笑。']],
      [72, ['聊天不费力，冷场会自己救场。', '口味接近，脾气互补。']],

      [93, ['这套组合，建议长期合作。', '一个眼神就知道下一步。']]
    ];

    var DEFAULT_ITEMS = ['默契度', '心动指数', '聊天续航', '吃货同步', '熬夜同步', '和好速度'];
    var MAX_ITEMS = 8;

    root.innerHTML =
