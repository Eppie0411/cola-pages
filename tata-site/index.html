            '<input class="js-name2" maxlength="10">' +
            '<div class="cap">点我换头像</div>' +
          '</button>' +
        '</div>' +
        '<div class="match-canvas-wrap"><canvas class="js-cv"></canvas></div>' +
        '<div class="mt-head">' +
          '<span>合拍项目</span>' +
          '<span class="mt-note">名字和数值都能自己改</span>' +
        '</div>' +
        '<div class="mt-list js-list"></div>' +
        '<div class="mt-texts">' +
          '<input class="mt-line js-title" maxlength="40" placeholder="卡片顶部那行小字（留空用默认）">' +
          '<input class="mt-line js-quote" maxlength="40" placeholder="卡片评语（留空自动生成）">' +
        '</div>' +
        '<div class="match-actions">' +
          '<button class="btn ghost mini js-add" type="button">＋ 加一条</button>' +
          '<button class="btn mini js-reroll" type="button">重新抽</button>' +
          '<button class="btn ghost mini js-save" type="button">保存图片</button>' +
        '</div>' +
        '<div class="hint">所有数值都只在这台电脑上算，头像和昵称不会上传。数值可以直接改，改成你们自己喜欢的也行。</div>' +
      '</div>';

    var $ = function (s) { return root.querySelector(s); };
    var cv = $('.js-cv');
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = W * dpr; cv.height = H * dpr;
    cv.style.aspectRatio = W + ' / ' + H;
    var ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var ava1 = $('.js-ava1'), ava2 = $('.js-ava2');
    var n1 = $('.js-name1'), n2 = $('.js-name2');
    var list = $('.js-list');

    n1.value = profile.name || '挞挞';
    n2.value = rival.name || '对面';

    stats.match = stats.match || {};
    if (!stats.match.items || !stats.match.items.length) {
      stats.match.items = DEFAULT_ITEMS.map(function (n) { return { name: n, v: 0 }; });
      stats.match.salt = Math.floor(Math.random() * 9999);
    }
    if (typeof stats.match.salt !== 'number') stats.match.salt = Math.floor(Math.random() * 9999);

    function cssVar(name, fallback) {
      var v = window.getComputedStyle(document.documentElement).getPropertyValue(name).trim();
      return v || fallback;
    }

    function seedOf(str) {
      var s = 7;
      for (var i = 0; i < str.length; i++) s = (s * 31 + str.charCodeAt(i) * (i + 5)) % 999983;
      return s;
    }

    function valueFor(name) {
      var s = seedOf((n1.value || '') + '|' + (n2.value || '') + '|' + name + '|' + (stats.match.salt || 0));
      return 46 + (s % 54);
    }

    function items() { return stats.match.items; }

    function total() {
      var it = items();
      if (!it.length) return 0;
      var sum = 0;
      it.forEach(function (o) { sum += o.v; });
      return Math.round(sum / it.length);
    }

    function quoteFor(v) {
      var band = QUOTES[0][1];
      for (var i = 0; i < QUOTES.length; i++) if (v >= QUOTES[i][0]) band = QUOTES[i][1];
      return band[seedOf(String(v) + (n1.value || '') + (n2.value || '')) % band.length];
    }

    function syncSlots() {
      if (profile.avatar) { ava1.style.backgroundImage = 'url(' + profile.avatar + ')'; ava1.textContent = ''; }
      else { ava1.style.backgroundImage = ''; ava1.textContent = (n1.value || '挞').slice(0, 1); }
      if (rival.avatar) { ava2.style.backgroundImage = 'url(' + rival.avatar + ')'; ava2.textContent = ''; }
      else { ava2.style.backgroundImage = ''; ava2.textContent = (n2.value || '对').slice(0, 1); }
    }

    function fitText(text, maxW, size, weight) {
      var s = size;
      do {
        ctx.font = weight + ' ' + s + 'px -apple-system,"PingFang SC",sans-serif';
        s -= 1;
      } while (ctx.measureText(text).width > maxW && s > 11);
      return s;
    }

    function roundRect(x, y, w, h, r) {
      if (w < r * 2) r = Math.max(1, w / 2);
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function roundCircle(img, cx, cy, r, fallback, initial) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fillStyle = fallback;
      ctx.fill();
      if (img) {
        ctx.save();
        ctx.clip();
        var s = Math.max((r * 2) / img.width, (r * 2) / img.height);
        var w = img.width * s, h = img.height * s;
        ctx.drawImage(img, cx - w / 2, cy - h / 2, w, h);
        ctx.restore();
      } else {
        ctx.fillStyle = cssVar('--accent', '#b05a32');
        ctx.font = '600 ' + Math.round(r * 0.9) + 'px -apple-system,"PingFang SC",sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(initial || '?', cx, cy + 2);
      }
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.lineWidth = 2;
      ctx.strokeStyle = cssVar('--ink', '#1d1b18');
      ctx.stroke();
      ctx.restore();
    }

    function drawCard() {
      var im1 = getImg(profile.avatar);
      var im2 = getImg(rival.avatar);
      if (profile.avatar && !im1) preload(profile.avatar, function () { drawCard(); });
      if (rival.avatar && !im2) preload(rival.avatar, function () { drawCard(); });

      var ink = cssVar('--ink', '#1d1b18');
      var muted = cssVar('--muted', '#8d8579');
      var line = cssVar('--line', '#e3ddd0');
      var accent = cssVar('--accent', '#b05a32');
      var cardBg = cssVar('--card', '#fffdf8');
      var paper = cssVar('--paper', '#f2efe7');

      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = paper;
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = cardBg;
      roundRect(30, 22, W - 60, H - 44, 10);
      ctx.fill();

      ctx.strokeStyle = line;
      ctx.lineWidth = 1.5;
      roundRect(44, 36, W - 88, H - 72, 6);
      ctx.stroke();

      ctx.fillStyle = muted;
      ctx.font = '500 13px -apple-system,"PingFang SC",sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'alphabetic';
      var ttl = (stats.match.title || '').trim() || 'C O M P A T I B I L I T Y   C A R D';
      var tsz = fitText(ttl, W - 220, 13, '500');
      ctx.font = '500 ' + tsz + 'px -apple-system,"PingFang SC",sans-serif';
      ctx.fillText(ttl, W / 2, 74);

      var r = 62, cy = 152;
      roundCircle(im1, W / 2 - 138, cy, r, '#f8ddc6', (n1.value || '挞').slice(0, 1));
      roundCircle(im2, W / 2 + 138, cy, r, '#dbe6ea', (n2.value || '对').slice(0, 1));

      ctx.fillStyle = muted;
      ctx.font = '300 26px -apple-system,"PingFang SC",sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('＋', W / 2, cy + 9);

      ctx.fillStyle = ink;
      var s1 = fitText(n1.value || '挞挞', 210, 18, '500');
      ctx.font = '500 ' + s1 + 'px -apple-system,"PingFang SC",sans-serif';
      ctx.fillText(n1.value || '挞挞', W / 2 - 138, cy + r + 32);
      var s2 = fitText(n2.value || '对面', 210, 18, '500');
      ctx.font = '500 ' + s2 + 'px -apple-system,"PingFang SC",sans-serif';
      ctx.fillText(n2.value || '对面', W / 2 + 138, cy + r + 32);

      ctx.strokeStyle = line;
      ctx.beginPath();
      ctx.moveTo(W / 2 - 250, 300);
      ctx.lineTo(W / 2 + 250, 300);
      ctx.stroke();

      var v = total();
      ctx.fillStyle = muted;
      ctx.font = '400 13px -apple-system,"PingFang SC",sans-serif';
      ctx.fillText('合 拍 指 数', W / 2, 328);

      ctx.fillStyle = ink;
      ctx.font = '600 74px ui-monospace,Menlo,monospace';
      ctx.fillText(v ? String(v) : '—', W / 2, 396);

      // 项目条：两列
      var it = items();
      var colW = 330, gapX = 40;
      var x0 = W / 2 - colW - gapX / 2;
      var y0 = 434, rowH = 40;
      var rows = Math.ceil(it.length / 2);
      it.forEach(function (o, i) {
        var col = i < rows ? 0 : 1;
        var row = i < rows ? i : i - rows;
        var x = col === 0 ? x0 : W / 2 + gapX / 2;
        var y = y0 + row * rowH;

        ctx.textAlign = 'left';
        ctx.fillStyle = ink;
        ctx.font = '500 14px -apple-system,"PingFang SC",sans-serif';
        var nm = o.name.length > 7 ? o.name.slice(0, 6) + '…' : o.name;
        ctx.fillText(nm, x, y);

        var bx = x + 108, bw = colW - 108 - 44;
        ctx.fillStyle = '#ece5d6';
        roundRect(bx, y - 8, bw, 8, 4);
        ctx.fill();
        ctx.fillStyle = accent;
        roundRect(bx, y - 8, Math.max(6, (bw * o.v) / 100), 8, 4);
        ctx.fill();

        ctx.textAlign = 'right';
        ctx.fillStyle = ink;
        ctx.font = '500 14px ui-monospace,Menlo,monospace';
        ctx.fillText(String(o.v), x + colW, y);
        ctx.textAlign = 'left';
      });

      ctx.textAlign = 'center';
      ctx.fillStyle = cssVar('--muted', '#8d8579');
      var q = '「' + (((stats.match.quote || '').trim()) || quoteFor(v)) + '」';
      var qs = fitText(q, W - 220, 19, '400');
      ctx.font = '400 ' + qs + 'px -apple-system,"PingFang SC",sans-serif';
      ctx.fillStyle = '#4a453d';
      ctx.fillText(q, W / 2, 588);

      ctx.fillStyle = muted;
      ctx.font = '400 12px -apple-system,"PingFang SC",sans-serif';
      var d = new Date();
      var ds = d.getFullYear() + '.' + ('0' + (d.getMonth() + 1)).slice(-2) + '.' + ('0' + d.getDate()).slice(-2);
      ctx.textAlign = 'left';
      ctx.fillText(ds, 66, H - 46);
      ctx.textAlign = 'right';
      ctx.fillText((profile.name || '挞挞') + '的小站', W - 66, H - 46);
      ctx.textAlign = 'left';
    }

    function renderList() {
      list.innerHTML = '';
      items().forEach(function (o, i) {
        var row = document.createElement('div');
        row.className = 'mt-row';

        var nm = document.createElement('input');
        nm.type = 'text';
        nm.value = o.name;
        nm.maxLength = 8;
        nm.addEventListener('input', function () {
          o.name = nm.value.slice(0, 8);
          if (!o.auto) o.v = valueFor(o.name);
          save(K.stats, stats);
          drawCard();
        });

        var bar = document.createElement('div');
        bar.className = 'bar';
        var fill = document.createElement('i');
        fill.style.width = o.v + '%';
        bar.appendChild(fill);

        var val = document.createElement('input');
        val.type = 'number';
        val.min = '0';
        val.max = '100';
        val.value = o.v;
        val.addEventListener('input', function () {
          var n = parseInt(val.value, 10);
          if (isNaN(n)) return;
          n = Math.max(0, Math.min(100, n));
          o.v = n;
          o.auto = true;
          fill.style.width = n + '%';
          save(K.stats, stats);
          drawCard();
        });

        var del = document.createElement('button');
        del.type = 'button';
        del.className = 'del';
        del.textContent = '×';
        del.title = '删掉这一条';
        del.addEventListener('click', function () {
          if (items().length <= 1) return;
          items().splice(i, 1);
          save(K.stats, stats);
          renderList();
          drawCard();
        });

        row.appendChild(nm);
        row.appendChild(bar);
        row.appendChild(val);
        row.appendChild(del);
        list.appendChild(row);
      });
    }

    function reroll() {
      stats.match.salt = Math.floor(Math.random() * 9999);
      items().forEach(function (o) { o.v = valueFor(o.name); o.auto = false; });
      save(K.stats, stats);
      renderList();
      drawCard();
    }

    var titleIn = $('.js-title'), quoteIn = $('.js-quote');
    titleIn.value = stats.match.title || '';
    quoteIn.value = stats.match.quote || '';
    titleIn.addEventListener('input', function () { stats.match.title = titleIn.value.slice(0, 40); save(K.stats, stats); drawCard(); });
    quoteIn.addEventListener('input', function () { stats.match.quote = quoteIn.value.slice(0, 40); save(K.stats, stats); drawCard(); });

    $('.js-add').addEventListener('click', function () {
      if (items().length >= MAX_ITEMS) return;
      var name = '新项目';
      var o = { name: name, v: valueFor(name + items().length) };
      items().push(o);
      save(K.stats, stats);
      renderList();
      drawCard();
      var inputs = list.querySelectorAll('.mt-row input[type=text]');
      if (inputs.length) { var last = inputs[inputs.length - 1]; last.focus(); last.select(); }
    });

    $('.js-reroll').addEventListener('click', reroll);
    $('.js-save').addEventListener('click', function () {
      try {
        var a = document.createElement('a');
        a.download = '合拍卡.png';
        a.href = cv.toDataURL('image/png');
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      } catch (e) {}
    });

    $('.js-p1').addEventListener('click', function (e) {
      if (e.target.tagName === 'INPUT') return;
      pickImage(function (url) {
        profile.avatar = url;
        save(K.profile, profile);
        syncSlots(); drawCard(); renderProfile();
      });
    });
    $('.js-p2').addEventListener('click', function (e) {
      if (e.target.tagName === 'INPUT') return;
      pickImage(function (url) {
        rival.avatar = url;
        save(K.rival, rival);
        syncSlots(); drawCard();
      });
    });

    n1.addEventListener('input', function () {
      profile.name = n1.value.trim().slice(0, 10) || '挞挞';
      save(K.profile, profile);
      items().forEach(function (o) { if (!o.auto) o.v = valueFor(o.name); });
      syncSlots(); renderList(); renderProfile(); drawCard();
    });
    n2.addEventListener('input', function () {
      rival.name = n2.value.trim().slice(0, 10) || '对面';
      save(K.rival, rival);
      items().forEach(function (o) { if (!o.auto) o.v = valueFor(o.name); });
      syncSlots(); renderList(); drawCard();
    });

    items().forEach(function (o) { if (!o.v) o.v = valueFor(o.name); });
    save(K.stats, stats);
    syncSlots();
    renderList();
    drawCard();

    return {
      redraw: drawCard,
      teardown: function () {},
      pause: function () {},
      resume: function () {},
      isPlaying: function () { return false; }
    };
  }

    var dc = $('.js-dc');

    function renderFilter() {

      pills($('.js-filter'), list, function (k) { return stats.cards.filter === k.id; }, function (k) {
        stats.cards.filter = k.id;

        renderFilter();
        updateCount();
      }, '类别', true);

    function updateCount() {
      $('.js-count').textContent = items().length + ' 张';
      $('.js-total').textContent = items().length + ' 张';
      $('.js-oname').textContent = stats.cards.owner || 'ta';

      back.className = 'dc-face dc-back js-back' + (card.skin && card.skin !== 'plain' ? ' skin-' + card.skin : '');
    }

    function pool() {
      var f = stats.cards.filter;
      return items().filter(function (c) { return f === 'all' || c.kind === f; });
    }

    function draw() {
      var list = pool();
      if (!list.length) {
        $('.js-last').textContent = '这个类别里还没有卡片，去下面加一张吧。';
        return;
      }
      var pick = list[(Math.random() * list.length) | 0];
      if (list.length > 1) {
        var guard = 0;
        while (pick === lastDrawn && guard++ < 8) pick = list[(Math.random() * list.length) | 0];
      }
      lastDrawn = pick;
      dc.classList.remove('flip');
      Sfx.click(520);
      window.setTimeout(function () {
        if (!root.contains(dc)) return;
        renderBack(pick);
        void dc.offsetWidth;
        dc.classList.add('flip');
        Sfx.win();
        $('.js-last').textContent = '刚抽到一张' + kindName(pick.kind) + '卡 · ' + dstr(new Date());
      }, 240);
    }

    function renderWall() {
      var wall = $('.js-wall');
      wall.innerHTML = '';
      updateCount();
      if (!items().length) {
        var e = document.createElement('div');
        e.className = 'note-wall-empty';

        b.appendChild(at);

    function renderEditorPills() {

      }, '类型', true);
      pills($('.js-ce-skins'), SKINS, function (s) { return draft.skin === s.id; }, function (s) {
        draft.skin = s.id; renderEditorPills();

      pills($('.js-ce-stamps'), STAMPS, function (s) { return draft.stamp === s; }, function (s) {

    $('.js-ce-save').addEventListener('click', function () {

    $('.js-ce-cancel').addEventListener('click', closeEditor);

  /* ==================== 双人拔河 ==================== */
  function createTug(root) {
    var $ = function (s) { return root.querySelector(s); };
    root.innerHTML =
      '<div class="gbar">' +
        '<div class="stat"><span>左边 · A</span><b class="js-s1">0</b></div>' +
        '<div class="stat"><span>右边 · L</span><b class="js-s2">0</b></div>' +
        '<div class="stat"><span>局数</span><b class="js-round">第 1 局</b></div>' +
      '</div>' +
      '<div class="tug-wrap"><div class="board"><canvas class="js-cv"></canvas></div></div>' +
      '<div class="hint">左边的人按 <kbd>A</kbd> 或点棋盘左半边，右边的人按 <kbd>L</kbd> 或点右半边。把中间的红布拉过自己那条虚线就赢一局，赢后自动开下一局。</div>';

    var cv = $('.js-cv');
    var ctx = setupCanvas(cv, 66, 36, 10);
    var W = 660, H = 360;
    stats.tug = stats.tug || { l: 0, r: 0 };

    var pos = 0, vel = 0, over = false, overAt = 0, winner = 0, round = 1;
    var flashL = 0, flashR = 0;
    var raf = 0, last = 0;

    function score() {
      $('.js-s1').textContent = stats.tug.l;
      $('.js-s2').textContent = stats.tug.r;
      $('.js-round').textContent = '第 ' + round + ' 局';
    }

    function pull(dir) {
      if (over) return;
      vel += dir * 0.082;
      if (dir < 0) flashL = 1; else flashR = 1;
    }

    function draw(ts) {
      ctx.clearRect(0, 0, W, H);
      var cx = 330, span = 200;
      var ropeY = 244;

      // 地面
      ctx.strokeStyle = '#e6ddc9';
      ctx.lineWidth = 1;
      [332, 340, 348].forEach(function (y) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(W, y);
        ctx.stroke();
      });

      // 赢线
      ctx.save();
      ctx.setLineDash([5, 5]);
      ctx.strokeStyle = '#d8cfbc';
      [cx - span, cx + span].forEach(function (x) {
        ctx.beginPath();
        ctx.moveTo(x, 150);
        ctx.lineTo(x, 336);
        ctx.stroke();
      });
      ctx.restore();

      // 中线
      ctx.strokeStyle = '#efe8d9';
      ctx.beginPath();
      ctx.moveTo(cx, 140);
      ctx.lineTo(cx, 336);
      ctx.stroke();

      var knot = cx + pos * span;

      // 绳子（两头被两只手抓住，中段微微下坠）
      ctx.strokeStyle = '#9b8465';
      ctx.lineWidth = 3.4;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(126, ropeY);
      ctx.quadraticCurveTo((126 + knot) / 2, ropeY + 20, knot, ropeY);
      ctx.quadraticCurveTo((knot + 534) / 2, ropeY + 20, 534, ropeY);
      ctx.stroke();
      ctx.lineWidth = 1;

      // 红布条
      ctx.fillStyle = '#b05a32';
      ctx.fillRect(knot - 4, ropeY - 32, 8, 46);
      ctx.beginPath();
      ctx.moveTo(knot + 4, ropeY - 32);
      ctx.lineTo(knot + 20, ropeY - 26);
      ctx.lineTo(knot + 4, ropeY - 20);
      ctx.closePath();
      ctx.fill();

      // 两侧小人
      function side(x, dirGain, ava, name) {
        var bob = Math.sin(ts / 130 + (x > 300 ? 1.7 : 0)) * 1.8;
        var hipY = 288 + bob;
        var handX = x + dirGain * 30;
        ctx.strokeStyle = '#1d1b18';
        ctx.lineWidth = 2;

        // 腿：前后撑开，重心向后
        ctx.beginPath();
        ctx.moveTo(x, hipY);
        ctx.lineTo(x - 22 * dirGain, hipY + 40);
        ctx.moveTo(x, hipY);
        ctx.lineTo(x + 15 * dirGain, hipY + 40);
        ctx.stroke();

        // 身体（后仰）
        ctx.beginPath();
        ctx.moveTo(x, hipY);
        ctx.lineTo(x - 16 * dirGain, hipY - 58);
        ctx.stroke();

        // 手臂伸向绳子
        ctx.beginPath();
        ctx.moveTo(x - 14 * dirGain, hipY - 48);
        ctx.lineTo(handX, ropeY + 2);
        ctx.stroke();

        drawAvatarHead(ctx, x - 16 * dirGain, hipY - 80, 21, ava, '#f0e6d4', '#1d1b18');

        ctx.fillStyle = '#8d8579';
        ctx.font = '11px -apple-system,sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(name, x, 138);
        ctx.textAlign = 'left';
      }
      side(96, 1, profile.avatar, '左边');
      side(564, -1, rival.avatar, '右边');

      // 用力闪光
      [[96, flashL], [564, flashR]].forEach(function (p) {
        if (p[1] > 0.02) {
          ctx.beginPath();
          ctx.arc(p[0], 260, 26 + (1 - p[1]) * 18, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(176,90,50,' + (p[1] * 0.5).toFixed(2) + ')';
          ctx.lineWidth = 3;
          ctx.stroke();
          ctx.lineWidth = 1;
        }
      });

      // 结束提示
      if (over) {
        var txt = winner < 0 ? '左边赢了' : '右边赢了';
        ctx.fillStyle = 'rgba(255,253,248,.94)';
        ctx.fillRect(cx - 96, 40, 192, 52);
        ctx.strokeStyle = '#e3ddd0';
        ctx.lineWidth = 1;
        ctx.strokeRect(cx - 96, 40, 192, 52);
        ctx.fillStyle = '#1d1b18';
        ctx.font = '600 20px -apple-system,sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(txt, cx, 73);
        ctx.textAlign = 'left';
      }
    }

    function frame(ts) {
      var dt = last ? Math.min(48, ts - last) : 16;
      last = ts;
      var k = dt / 16.7;
      flashL = Math.max(0, flashL - 0.05 * k);
      flashR = Math.max(0, flashR - 0.05 * k);

      if (!over) {
        pos += vel * 0.02 * k;
        vel *= Math.pow(0.90, k);
        if (pos <= -0.94) finish(-1, ts);
        else if (pos >= 0.94) finish(1, ts);
        if (pos > 0.99) pos = 0.99;
        if (pos < -0.99) pos = -0.99;
      } else if (ts - overAt > 1300) {
        over = false;
        pos = 0;
        vel = 0;
        round++;
        score();
      }

      draw(ts);
      raf = window.requestAnimationFrame(frame);
    }

    function finish(dir, ts) {
      over = true;
      overAt = ts;
      winner = dir;
      if (dir < 0) stats.tug.l++; else stats.tug.r++;
      save(K.stats, stats);
      score();
    }

    function onKey(e) {
      if (e.repeat) return;
      var k = e.key.toLowerCase();
      if (k === 'a' || k === 'arrowleft') { e.preventDefault(); pull(-1); }
      else if (k === 'l' || k === 'arrowright') { e.preventDefault(); pull(1); }
    }
    window.addEventListener('keydown', onKey);

    cv.addEventListener('pointerdown', function (e) {
      var r = cv.getBoundingClientRect();
      var x = (e.clientX - r.left) * (W / r.width);
      pull(x < W / 2 ? -1 : 1);
    });

    score();
    raf = window.requestAnimationFrame(frame);

    return {
      teardown: function () {
        window.cancelAnimationFrame(raf);
        window.removeEventListener('keydown', onKey);
      },
      pause: function () {},
      resume: function () {},
      isPlaying: function () { return false; }
    };
  }

  /* ==================== 五子棋 ==================== */
  function createGomoku(root) {
    var $ = function (s) { return root.querySelector(s); };
    var N = 11, cell = 44, pad = 24;
    var W = pad * 2 + (N - 1) * cell;

    root.innerHTML =
      '<div class="gbar">' +
        '<div class="stat"><span>黑</span><b class="js-s1">0</b></div>' +
        '<div class="stat"><span>白</span><b class="js-s2">0</b></div>' +
        '<div class="stat"><span>轮到</span><b class="js-turn">黑棋</b></div>' +
      '</div>' +
      '<div class="go-wrap"><div class="board"><canvas class="js-cv"></canvas></div></div>' +
      '<div class="rowline" style="margin-top:12px">' +
        '<div class="hint" style="margin:0">黑先。五个子横竖斜连成一线就赢。</div>' +
        '<div class="duel-actions">' +
          '<button class="btn ghost mini js-undo" type="button">悔棋</button>' +
          '<button class="btn ghost mini js-reset" type="button">重开</button>' +
        '</div>' +
      '</div>';

    var cv = $('.js-cv');
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = W * dpr;
    cv.height = W * dpr;
    cv.style.aspectRatio = '1 / 1';
    var ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    stats.go = stats.go || { b: 0, w: 0 };

    var grid = [], turn = 1, over = false, winCells = null, lastMove = null, history = [];

    function reset() {
      grid = [];
      for (var r = 0; r < N; r++) {
        grid.push([]);
        for (var c = 0; c < N; c++) grid[r].push(0);
      }
      turn = 1;
      over = false;
      winCells = null;
      lastMove = null;
      history = [];
      hud();
      paint();
    }

    function hud() {
      $('.js-s1').textContent = stats.go.b;
      $('.js-s2').textContent = stats.go.w;
      $('.js-turn').textContent = over ? (winCells ? (turn === 1 ? '白棋赢' : '黑棋赢') : '平局') : (turn === 1 ? '黑棋' : '白棋');
    }

    function px(i) { return pad + i * cell; }

    function paint() {
      ctx.clearRect(0, 0, W, W);
      ctx.fillStyle = '#f8f4ea';
      ctx.fillRect(0, 0, W, W);

      ctx.strokeStyle = '#ddcfb6';
      ctx.lineWidth = 1;
      for (var i = 0; i < N; i++) {
        ctx.beginPath();
        ctx.moveTo(px(0), px(i) + 0.5);
        ctx.lineTo(px(N - 1), px(i) + 0.5);
        ctx.moveTo(px(i) + 0.5, px(0));
        ctx.lineTo(px(i) + 0.5, px(N - 1));
        ctx.stroke();
      }

      ctx.fillStyle = '#c9b795';
      [[3, 3], [3, 7], [7, 3], [7, 7], [5, 5]].forEach(function (p) {
        ctx.beginPath();
        ctx.arc(px(p[0]), px(p[1]), 2.6, 0, Math.PI * 2);
        ctx.fill();
      });

      for (var r = 0; r < N; r++) {
        for (var c = 0; c < N; c++) {
          var v = grid[r][c];
          if (!v) continue;
          drawStone(c, r, v);
        }
      }

      if (winCells) {
        ctx.strokeStyle = '#b05a32';
        ctx.lineWidth = 2;
        winCells.forEach(function (p) {
          ctx.beginPath();
          ctx.arc(px(p[0]), px(p[1]), cell * 0.42 + 3, 0, Math.PI * 2);
          ctx.stroke();
        });
        ctx.lineWidth = 1;
      } else if (lastMove) {
        ctx.beginPath();
        ctx.arc(px(lastMove[0]), px(lastMove[1]), 4, 0, Math.PI * 2);
        ctx.fillStyle = lastMove[2] === 1 ? '#fffdf8' : '#b05a32';
        ctx.fill();
      }
    }

    function drawStone(c, r, v) {
      var x = px(c), y = px(r), rad = cell * 0.42;
      ctx.beginPath();
      ctx.arc(x, y, rad, 0, Math.PI * 2);
      if (v === 1) {
        ctx.fillStyle = '#211e1a';
        ctx.fill();
        ctx.beginPath();
        ctx.arc(x - rad * 0.28, y - rad * 0.3, rad * 0.22, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,.22)';
        ctx.fill();
      } else {
        ctx.fillStyle = '#fffdf8';
        ctx.fill();
        ctx.strokeStyle = '#c4b9a2';
        ctx.lineWidth = 1.4;
        ctx.stroke();
        ctx.lineWidth = 1;
      }
    }

    function check(r, c, v) {
      var dirs = [[1, 0], [0, 1], [1, 1], [1, -1]];
      for (var d = 0; d < dirs.length; d++) {
        var dx = dirs[d][0], dy = dirs[d][1];
        var cells = [[c, r]];
        for (var s = 1; s < 5; s++) {
          var cc = c + dx * s, rr = r + dy * s;
          if (cc < 0 || cc >= N || rr < 0 || rr >= N || grid[rr][cc] !== v) break;
          cells.push([cc, rr]);
        }
        for (var s2 = 1; s2 < 5; s2++) {
          var cc2 = c - dx * s2, rr2 = r - dy * s2;
          if (cc2 < 0 || cc2 >= N || rr2 < 0 || rr2 >= N || grid[rr2][cc2] !== v) break;
          cells.unshift([cc2, rr2]);
        }
        if (cells.length >= 5) return cells.slice(0, 5);
      }
      return null;
    }

    function place(c, r) {
      if (over || c < 0 || c >= N || r < 0 || r >= N) return;
      if (grid[r][c]) return;
      grid[r][c] = turn;
      history.push([c, r, turn]);
      lastMove = [c, r, turn];
      var w = check(r, c, turn);
      if (w) {
        over = true;
        winCells = w;
        if (turn === 1) stats.go.b++; else stats.go.w++;
        save(K.stats, stats);
      } else {
        turn = turn === 1 ? 2 : 1;
      }

      teardown: function () {},
      pause: function () {},

  }

  /* ==================== 戳泡泡 ==================== */
  function createBubble(root) {
    var $ = function (s) { return root.querySelector(s); };
    root.innerHTML =
      '<div class="gbar">' +
        '<div class="stat"><span>戳破</span><b class="js-score">0</b></div>' +
        '<div class="stat"><span>连击</span><b class="js-combo">0</b></div>' +
        '<div class="stat"><span>最多</span><b class="js-best">0</b></div>' +
      '</div>' +
      '<div class="bub-wrap"><div class="board"><canvas class="js-cv"></canvas></div></div>' +
      '<div class="hint">没有计时，慢慢戳。连着戳破气泡会累积连击，断了也没关系。</div>';

    var cv = $('.js-cv');
    var ctx = setupCanvas(cv, 66, 42, 10);
    var W = 660, H = 420;

    var bubbles = [], rings = [], score = 0, combo = 0, best = 0, lastPop = 0;
    var acc = 0, raf = 0, last = 0, t0 = 0;
    var COLORS = ['91,123,140', '176,90,50', '212,117,111', '141,163,120'];
    var popped = 0;

    stats.bubbleBest = stats.bubbleBest || 0;

    function hud() {
      $('.js-score').textContent = score;
      $('.js-combo').textContent = combo;
      $('.js-best').textContent = stats.bubbleBest;
    }

    function spawn() {
      var r = 12 + Math.random() * 30;
      bubbles.push({
        x: 40 + Math.random() * (W - 80),
        y: H + r,
        r: r,
        sp: 0.32 + Math.random() * 0.42,
        ph: Math.random() * Math.PI * 2,
        amp: 8 + Math.random() * 16,
        c: COLORS[(Math.random() * COLORS.length) | 0],
        seed: Math.random() * 100
      });
    }

    function popAt(x, y) {
      for (var i = bubbles.length - 1; i >= 0; i--) {
        var b = bubbles[i];
        var dx = x - b.x, dy = y - b.y;
        if (dx * dx + dy * dy <= (b.r + 4) * (b.r + 4)) {
          bubbles.splice(i, 1);
          rings.push({ x: b.x, y: b.y, r: b.r, life: 1, c: b.c });
          var now = Date.now();
          if (now - lastPop < 1400) combo++; else combo = 1;
          lastPop = now;

          popped++;

            stats.bubbleBest = score;

        }
      }

      var rc = cv.getBoundingClientRect();

      // 淡淡的底
      var grd = ctx.createLinearGradient(0, 0, 0, H);
      grd.addColorStop(0, '#f8f4e9');
      grd.addColorStop(1, '#f2ecdd');
      ctx.fillStyle = grd;
      ctx.fillRect(0, 0, W, H);

      bubbles.forEach(function (b) {
        var wob = Math.sin(ts / 900 + b.ph) * b.amp * 0.12;
        var x = b.x + wob * 4, y = b.y;
        var grd = ctx.createRadialGradient(x - b.r * 0.3, y - b.r * 0.35, b.r * 0.1, x, y, b.r);
        grd.addColorStop(0, 'rgba(255,255,255,.92)');
        grd.addColorStop(0.62, 'rgba(255,255,255,.42)');
        grd.addColorStop(1, 'rgba(' + b.c + ',.22)');
        ctx.beginPath();
        ctx.arc(x, y, b.r, 0, Math.PI * 2);
        ctx.fillStyle = grd;
        ctx.fill();
        ctx.strokeStyle = 'rgba(' + b.c + ',.42)';
        ctx.lineWidth = 1.2;
        ctx.stroke();

        // 上缘高光弧
        ctx.beginPath();
        ctx.arc(x, y, b.r * 0.9, Math.PI * 1.12, Math.PI * 1.72);
        ctx.strokeStyle = 'rgba(255,255,255,.95)';
        ctx.lineWidth = b.r * 0.14;
        ctx.lineCap = 'round';
        ctx.stroke();
        ctx.lineCap = 'butt';

        // 高光点
        ctx.beginPath();
        ctx.arc(x - b.r * 0.34, y - b.r * 0.4, b.r * 0.16, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,.98)';
        ctx.fill();

        // 虹彩边
        ctx.beginPath();
        ctx.arc(x, y, b.r * 0.97, Math.PI * 0.55, Math.PI * 0.95);
        ctx.strokeStyle = 'rgba(232,160,190,.5)';
        ctx.lineWidth = 1.6;
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(x, y, b.r * 0.97, Math.PI * 1.55, Math.PI * 1.95);
        ctx.strokeStyle = 'rgba(140,190,225,.45)';
        ctx.lineWidth = 1.6;
        ctx.stroke();

        // 底部反光
        ctx.beginPath();
        ctx.arc(x + b.r * 0.28, y + b.r * 0.42, b.r * 0.12, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,.55)';
        ctx.fill();
        ctx.lineWidth = 1;
      });

      rings.forEach(function (g) {
        ctx.beginPath();
        ctx.arc(g.x, g.y, g.r + (1 - g.life) * 26, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(' + g.c + ',' + (g.life * 0.55).toFixed(2) + ')';
        ctx.lineWidth = 2 * g.life + 0.5;
        ctx.stroke();
        ctx.lineWidth = 1;
        var n = 5;
        for (var i = 0; i < n; i++) {
          var a = (Math.PI * 2 * i) / n + g.r;
          var d = g.r + (1 - g.life) * 34;
          ctx.beginPath();
          ctx.arc(g.x + Math.cos(a) * d, g.y + Math.sin(a) * d, 2.4 * g.life + 0.4, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(' + g.c + ',' + (g.life * 0.6).toFixed(2) + ')';
          ctx.fill();
        }
      });

      if (combo >= 5) {
        ctx.fillStyle = 'rgba(176,90,50,.85)';
        ctx.font = '600 13px -apple-system,sans-serif';
        ctx.fillText('连击 ×' + combo, 22, 34);
      }
    }

    function frame(ts) {
      var dt = last ? Math.min(48, ts - last) : 16;
      last = ts;
      var k = dt / 16.7;

      acc += dt;
      if (acc > 320) { acc = 0; if (bubbles.length < 26) spawn(); }
      if (!bubbles.length) spawn();

      bubbles.forEach(function (b) {
        b.y -= b.sp * k;
        b.x += Math.sin(ts / 1100 + b.ph) * 0.16 * k;
      });
      bubbles = bubbles.filter(function (b) { return b.y > -b.r - 10; });

      rings.forEach(function (g) { g.life -= 0.045 * k; });
      rings = rings.filter(function (g) { return g.life > 0; });

      if (Date.now() - lastPop > 1500 && combo) {
        combo = 0;
        hud();
      }

      draw(ts);
      raf = window.requestAnimationFrame(frame);
    }

    for (var i = 0; i < 18; i++) {
      spawn();
      bubbles[bubbles.length - 1].y = Math.random() * H;
    }
    hud();
    raf = window.requestAnimationFrame(frame);

    return {
      teardown: function () { window.cancelAnimationFrame(raf); },
      pause: function () {},
      resume: function () {},
      isPlaying: function () { return false; }
    };
  }

  /* ==================== 抓娃娃 ==================== */

    function drawPlush(x, y, r, type, wob) {
      ctx.save();

      } else if (type === 'cat') {
        [-1, 1].forEach(function (s) {
          ctx.beginPath();
          ctx.moveTo(s * r * 0.72, -r * 0.5);
          ctx.lineTo(s * r * 0.74, -r * 1.16);
          ctx.lineTo(s * r * 0.16, -r * 0.86);

          ctx.fill(); ctx.stroke();

      } else if (type === 'bear') {
        [-1, 1].forEach(function (s) {

      // 身体

      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();

      // 脸
      ctx.fillStyle = '#1d1b18';
      ctx.beginPath();
      ctx.arc(-r * 0.3, -r * 0.1, r * 0.09, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(r * 0.3, -r * 0.1, r * 0.09, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = 'rgba(212,117,111,.5)';
      ctx.beginPath();
      ctx.arc(-r * 0.52, r * 0.22, r * 0.13, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(r * 0.52, r * 0.22, r * 0.13, 0, Math.PI * 2);
      ctx.fill();

      if (type === 'duck') {
        ctx.beginPath();
        ctx.moveTo(-r * 0.16, r * 0.16);
        ctx.lineTo(r * 0.2, r * 0.2);
        ctx.lineTo(r * 0.02, r * 0.36);
        ctx.closePath();
        ctx.fillStyle = '#e2a05e';
        ctx.fill();
        ctx.strokeStyle = '#1d1b18';
        ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.moveTo(-r * 0.16, r * 0.2);

      ctx.lineWidth = 1.6;

      });

      if (held) {
        drawPlush(clawX, clawY + 34 + held.r * 0.55, held.r, held.type, Math.sin(ts / 260) * 2);
      }

      if (msg && ts < msgUntil) {
        ctx.fillStyle = 'rgba(176,90,50,.9)';

      raf = window.requestAnimationFrame(frame);

    function onKey(e) {

      else if (k === ' ' || k === 'Spacebar') { e.preventDefault(); grab(); }

    function onKeyUp(e) {

      if (k === 'ArrowLeft' || k === 'a' || k === 'A') kLeft = false;

    window.addEventListener('keyup', onKeyUp);

    holdBtn($('.js-rb'), function (v) { kRight = v; });
    $('.js-grab').addEventListener('click', grab);

    layout();
    raf = window.requestAnimationFrame(frame);

    return {
      teardown: function () {
        window.cancelAnimationFrame(raf);
        window.removeEventListener('keydown', onKey);
        window.removeEventListener('keyup', onKeyUp);
      },
      pause: function () {},
      resume: function () {},
      isPlaying: function () { return false; }
    };
  }

      $('.js-got').textContent = got;
      $('.js-best').textContent = best;
      if (st) $('.js-st').textContent = st;
    }

    $('.js-diff').appendChild(diffBar('fish', function () {
      windowMs = WIN[diffOf('fish')];
    }));
    windowMs = WIN[diffOf('fish')] || 1050;

    function cast() {
      if (state === 'wait' || state === 'bite') {
        // 收线
        if (state === 'bite') {
          var left = biteAt + windowMs - performance.now();
          if (left > 0) catchFish();
          else escape();
        }
        return;
      }
      if (state === 'caught') return;
      state = 'wait';
      floatX = 120 + Math.random() * 420;
      floatY = 168;
      biteAt = performance.now() + 900 + Math.random() * 2200;
      Sfx.splash();
      hud('等鱼咬钩');
    }

    function pickFish() {
      var total = FISHES.reduce(function (a, f) { return a + f.w; }, 0);
      var r = Math.random() * total;
      for (var i = 0; i < FISHES.length; i++) {
        r -= FISHES[i].w;
        if (r <= 0) return FISHES[i];
      }
      return FISHES[0];
    }

    function catchFish() {
      var f = pickFish();
      got += f.p;
      if (got > best) { best = got; stats.fishBest = best; save(K.stats, stats); }
      lastCatch = f.name + ' +' + f.p;
      lastUntil = performance.now() + 1600;
      caughtFish = f;
      catchT = performance.now();
      state = 'caught';
      Sfx.win();
      hud('上钩了');
      window.setTimeout(function () {
        if (state === 'caught') { state = 'idle'; caughtFish = null; hud('还没抛竿'); }
      }, 1100);
    }

    function escape() {
      state = 'idle';
      lastCatch = '跑了…';
      lastUntil = performance.now() + 1200;
      Sfx.click(240);
      hud('还没抛竿');
    }

    function drawFishSimple(x, y, s, color, flip) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(flip ? -s : s, s);
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-14, 0);
      ctx.quadraticCurveTo(-26, -9, -28, 0);
      ctx.quadraticCurveTo(-26, 9, -14, 0);
      ctx.stroke();
      ctx.beginPath();
      ctx.ellipse(0, 0, 15, 9, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(7, -2, 1.6, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();
      ctx.restore();
    }

    function draw(ts) {
      ctx.clearRect(0, 0, W, H);

      // 天空 / 岸边
      ctx.fillStyle = '#f8f4e9';
      ctx.fillRect(0, 0, W, 150);

      // 水面
      var g = ctx.createLinearGradient(0, 150, 0, H);
      g.addColorStop(0, '#e7eef1');
      g.addColorStop(1, '#d3e1e7');
      ctx.fillStyle = g;
      ctx.fillRect(0, 150, W, H - 150);

      ctx.beginPath();
      ctx.moveTo(0, 150);
      ctx.lineTo(W, 150);
      ctx.strokeStyle = '#c4d4da';
      ctx.lineWidth = 2;
      ctx.stroke();

      // 水波纹
      ctx.strokeStyle = 'rgba(255,255,255,.55)';
      ctx.lineWidth = 1.4;
      for (var i = 0; i < 5; i++) {
        var y = 190 + i * 46;
        ctx.beginPath();
        for (var x = 0; x <= W; x += 12) {
          var yy = y + Math.sin((x + ts / 30) / 60 + i) * 2.2;
          if (x === 0) ctx.moveTo(x, yy); else ctx.lineTo(x, yy);
        }
        ctx.stroke();
      }

      // 背景鱼
      decos.forEach(function (d) {
        d.x += d.sp * (ts % 2 ? 1 : 1) * 0.7;
        if (d.x < -40) d.x = W + 40;
        if (d.x > W + 40) d.x = -40;
        var y = d.y + Math.sin(ts / 700 + d.ph) * 5;
        drawFishSimple(d.x, y, d.s * 0.9, 'rgba(91,123,140,.35)', d.sp < 0);
      });

      // 鱼竿
      ctx.strokeStyle = '#9b8465';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(W - 8, 26);
      ctx.quadraticCurveTo(W - 120, 30, W - 210, 96);
      ctx.stroke();
      ctx.lineWidth = 1;

      if (state === 'idle' || state === 'caught') {
        ctx.fillStyle = '#b9af9a';
        ctx.font = '13px -apple-system,sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('水里有些动静…按空格抛竿', W / 2, 120);
        ctx.textAlign = 'left';
      } else {
        var bite = state === 'bite';
        var fy = floatY + (bite ? 12 : Math.sin(ts / 300) * 2.5);

        // 鱼线
        ctx.strokeStyle = 'rgba(90,80,70,.55)';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(W - 210, 96);
        ctx.quadraticCurveTo((W - 210 + floatX) / 2, fy - 60, floatX, fy);
        ctx.stroke();

        // 波纹
        if (!bite) {
          var rr = (ts % 1600) / 1600;
          ctx.beginPath();
          ctx.arc(floatX, fy + 6, 8 + rr * 26, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(255,255,255,' + (0.5 * (1 - rr)).toFixed(2) + ')';
          ctx.lineWidth = 1.5;
          ctx.stroke();
        } else {
          for (var s2 = 0; s2 < 3; s2++) {
            var r2 = ((ts / 300 + s2 * 0.33) % 1);
            ctx.beginPath();
            ctx.arc(floatX, fy + 8, 10 + r2 * 40, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255,255,255,' + (0.55 * (1 - r2)).toFixed(2) + ')';
            ctx.lineWidth = 2;
            ctx.stroke();
          }
        }

        // 浮标
        ctx.beginPath();
        ctx.arc(floatX, fy, 7, Math.PI, 0);
        ctx.fillStyle = '#d4756f';
        ctx.fill();
        ctx.beginPath();
        ctx.arc(floatX, fy, 7, 0, Math.PI);
        ctx.fillStyle = '#fffdf8';
        ctx.fill();
        ctx.beginPath();
        ctx.arc(floatX, fy, 7, 0, Math.PI * 2);
        ctx.strokeStyle = '#1d1b18';
        ctx.lineWidth = 1.4;
        ctx.stroke();

        if (bite) {
          ctx.fillStyle = '#b05a32';
          ctx.font = '600 26px -apple-system,sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('！', floatX, fy - 26);
          ctx.textAlign = 'left';
          // 时限条
          var left = Math.max(0, (biteAt + windowMs - performance.now()) / windowMs);
          ctx.fillStyle = '#ece5d6';
          ctx.fillRect(W / 2 - 90, 128, 180, 6);
          ctx.fillStyle = left > 0.4 ? '#8fae7a' : '#d4756f';
          ctx.fillRect(W / 2 - 90, 128, 180 * left, 6);
        }
      }

      // 钓到的鱼飞出去
      if (caughtFish) {
        var t = Math.min(1, (performance.now() - catchT) / 700);
        var fx = floatX + (260) * t;
        var fy2 = floatY - 120 * Math.sin(t * Math.PI) + t * 40;
        drawFishSimple(fx, fy2, 1.1, caughtFish.c, false);
      }

      // 提示文字
      if (lastCatch && ts < lastUntil) {
        ctx.fillStyle = 'rgba(29,27,24,.85)';
        ctx.font = '600 15px -apple-system,sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(lastCatch, W / 2, 400);
        ctx.textAlign = 'left';
      }
    }

    function frame(ts) {
      var now = performance.now();
      if (state === 'wait' && now >= biteAt) {
        state = 'bite';
        biteAt = now;
        Sfx.bite();
        hud('咬钩了！快收线');
      } else if (state === 'bite' && now > biteAt + windowMs) {
        escape();
      }

      draw(ts);
      raf = window.requestAnimationFrame(frame);
    }

    function onKey(e) {
      if (e.key === ' ' || e.key === 'Spacebar' || e.key === 'Enter') {
        e.preventDefault();
        cast();
      }
    }
    window.addEventListener('keydown', onKey);
    $('.js-act').addEventListener('click', cast);

    hud('还没抛竿');
    raf = window.requestAnimationFrame(frame);

    return {
      teardown: function () {
        window.cancelAnimationFrame(raf);
        window.removeEventListener('keydown', onKey);
      },
      pause: function () {},
      resume: function () {},
      isPlaying: function () { return false; }
    };
  }

  /* ==================== 小兔子跳一跳 ==================== */
  function createJump(root) {
    var $ = function (s) { return root.querySelector(s); };
    root.innerHTML =
      '<div class="gbar">' +
        '<div class="stat"><span>跳了</span><b class="js-score">0</b></div>' +
        '<div class="stat"><span>最远</span><b class="js-best">0</b></div>' +
        '<div class="stat"><span>状态</span><b class="js-st">按住蓄力</b></div>' +
      '</div>' +
      '<div class="board"><canvas class="js-cv"></canvas></div>' +
      '<div class="hint">按住画面（或空格）蓄力，松开就跳。落在下一块蛋糕上算过，掉下去就重来。</div>';

    var cv = $('.js-cv');
    var ctx = setupCanvas(cv, 66, 42, 10);
    var W = 660, H = 420, GROUND = 300;

    var plats = [], cur = 0, camX = 0, camTarget = 0;
    var bunny = { x: 0, y: GROUND, vx: 0, vy: 0 };
    var phase = 'idle', power = 0, score = 0, best = stats.jumpBest || 0;
    var raf = 0, last = 0, shake = 0;

    function gen() {
      plats = [{ x: 60, w: 110 }];
      for (var i = 0; i < 12; i++) addPlat();
      cur = 0;
      bunny.x = plats[0].x + plats[0].w / 2;
      bunny.y = GROUND;
      bunny.vx = 0; bunny.vy = 0;
      camX = 0; camTarget = 0;
      score = 0; phase = 'idle'; power = 0;
      hud('按住蓄力');
    }

    function addPlat() {
      var prev = plats[plats.length - 1];
      var gap = 70 + Math.random() * 90;
      var w = 58 + Math.random() * 44;
      plats.push({ x: prev.x + prev.w + gap, w: w });
    }

    function hud(st) {
      $('.js-score').textContent = score;
      $('.js-best').textContent = best;
      if (st) $('.js-st').textContent = st;
    }

    function charge(on) {
      if (phase === 'over') {
        if (on) { gen(); }
        return;
      }
      if (on && phase === 'idle') { phase = 'charge'; power = 0; Sfx.click(420); }
      else if (!on && phase === 'charge') { launch(); }
    }

    function launch() {
      phase = 'air';
      var p = Math.min(1, power);
      bunny.vx = 2.4 + p * 6.4;
      bunny.vy = -7.4 - p * 3.2;
      Sfx.click(660);
      hud('飞起来了');
    }

    function roundRect(x, y, w, h, r) {
      if (w < r * 2) r = Math.max(1, w / 2);
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function drawCake(p, i) {
      var x = p.x - camX, y = GROUND;
      var colors = ['#f3ddc0', '#f7e6cf', '#efd3bd'];
      var c = colors[i % colors.length];
      ctx.fillStyle = c;
      ctx.strokeStyle = '#c9b393';
      ctx.lineWidth = 1.6;
      roundRect(x, y, p.w, 22, 6);
      ctx.fill(); ctx.stroke();
      // 奶油
      ctx.beginPath();
      ctx.moveTo(x + 4, y + 12);
      for (var k = 0; k <= 6; k++) {
        var xx = x + 4 + (p.w - 8) * (k / 6);
        ctx.lineTo(xx, y + 12 + (k % 2 ? 3 : -1));
      }
      ctx.strokeStyle = '#e7c9a6';
      ctx.lineWidth = 2.4;
      ctx.stroke();
      // 小樱桃
      ctx.beginPath();
      ctx.arc(x + p.w / 2, y - 3, 3.4, 0, Math.PI * 2);
      ctx.fillStyle = '#d4756f';
      ctx.fill();
      ctx.lineWidth = 1;
    }

    function drawBunny(squash) {
      var x = bunny.x - camX, y = bunny.y;
      ctx.save();
      ctx.translate(x, y - 16);
      var sx = 1 + squash * 0.35, sy = 1 - squash * 0.35;
      ctx.scale(sx, sy);
      ctx.strokeStyle = '#1d1b18';
      ctx.lineWidth = 2;
      ctx.fillStyle = '#fdf7ef';

      // 耳朵
      [-1, 1].forEach(function (s) {
        ctx.beginPath();
        ctx.ellipse(s * 5, -18, 3.4, 9, s * 0.12, 0, Math.PI * 2);
        ctx.fill(); ctx.stroke();
      });
      // 身体
      ctx.beginPath();
      ctx.arc(0, 0, 13, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
      // 眼睛
      ctx.fillStyle = '#1d1b18';
      ctx.beginPath(); ctx.arc(-4.4, -2, 1.5, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(4.4, -2, 1.5, 0, Math.PI * 2); ctx.fill();
      // 腮红
      ctx.fillStyle = 'rgba(212,117,111,.5)';
      ctx.beginPath(); ctx.arc(-7.5, 2.6, 2.4, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(7.5, 2.6, 2.4, 0, Math.PI * 2); ctx.fill();
      // 嘴
      ctx.strokeStyle = '#1d1b18';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(-2, 2.4); ctx.quadraticCurveTo(0, 4.4, 2, 2.4);
      ctx.stroke();
      ctx.restore();
    }

    function draw(ts) {
      ctx.clearRect(0, 0, W, H);

      // 天空
      var g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, '#fbf7ee');
      g.addColorStop(1, '#f1eadb');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);

      // 云
      ctx.fillStyle = 'rgba(255,255,255,.75)';
      [[120, 80, 26], [300, 56, 20], [470, 96, 30], [600, 60, 18]].forEach(function (c) {
        var x = c[0] - camX * 0.35;
        x = ((x % 760) + 760) % 760 - 50;
        ctx.beginPath();
        ctx.arc(x, c[1], c[2], 0, Math.PI * 2);
        ctx.arc(x + c[2] * 0.9, c[1] + 4, c[2] * 0.7, 0, Math.PI * 2);
        ctx.arc(x - c[2] * 0.9, c[1] + 5, c[2] * 0.65, 0, Math.PI * 2);
        ctx.fill();
      });

      // 蛋糕台
      plats.forEach(function (p, i) { drawCake(p, i); });

      // 兔子
      var squash = phase === 'charge' ? Math.min(1, power) * 0.9 : 0;
      drawBunny(squash);

      // 蓄力条
      if (phase === 'charge') {
        var bx = 22, by = 22, bw = 150;
        ctx.fillStyle = 'rgba(255,253,248,.85)';
        roundRect(bx - 6, by - 10, bw + 12, 26, 10);
        ctx.fill();
        ctx.fillStyle = '#ece5d6';
        roundRect(bx, by - 2, bw, 8, 4);
        ctx.fill();
        ctx.fillStyle = power > 0.8 ? '#d4756f' : 'var(--accent)';
        ctx.fillStyle = power > 0.8 ? '#d4756f' : '#b05a32';
        roundRect(bx, by - 2, Math.max(4, bw * power), 8, 4);
        ctx.fill();
      }

      if (phase === 'over') {
        ctx.fillStyle = 'rgba(255,253,248,.92)';
        roundRect(W / 2 - 120, 130, 240, 92, 14);
        ctx.fill();
        ctx.strokeStyle = '#e3ddd0';
        ctx.lineWidth = 1;
        roundRect(W / 2 - 120, 130, 240, 92, 14);
        ctx.stroke();
        ctx.fillStyle = '#1d1b18';
        ctx.textAlign = 'center';
        ctx.font = '600 20px -apple-system,sans-serif';
        ctx.fillText('掉下去了…', W / 2, 168);
        ctx.font = '400 13px -apple-system,sans-serif';
        ctx.fillStyle = '#8d8579';
        ctx.fillText('点一下重新开始', W / 2, 196);
        ctx.textAlign = 'left';
      }
    }

    function frame(ts) {
      var dt = last ? Math.min(48, ts - last) : 16;
      last = ts;
      var k = dt / 16.7;

      if (phase === 'charge') {
        power = Math.min(1, power + 0.028 * k);
      } else if (phase === 'air') {
        bunny.x += bunny.vx * k;
        bunny.vy += 0.42 * k;
        bunny.y += bunny.vy * k;

        if (bunny.vy > 0 && bunny.y >= GROUND) {
          var landed = -1;
          for (var i = 0; i < plats.length; i++) {
            if (bunny.x > plats[i].x + 4 && bunny.x < plats[i].x + plats[i].w - 4) { landed = i; break; }
          }
          if (landed >= 0) {
            bunny.y = GROUND;
            bunny.vx = 0; bunny.vy = 0;
            phase = 'idle';
            power = 0;
            if (landed > cur) {
              score += landed - cur;
              cur = landed;
              while (plats.length - cur < 8) addPlat();
              Sfx.pop(1);
              hud('按住蓄力');
            } else {
              hud('回到原来那块了');
            }
            if (score > best) { best = score; stats.jumpBest = best; save(K.stats, stats); }
            hud();
            camTarget = Math.max(0, bunny.x - 200);
          } else {
            phase = 'over';
            Sfx.click(180);
            hud('掉了');
          }

      }

      draw(ts);
      raf = window.requestAnimationFrame(frame);
    }

    function onDown(e) {

    function onUp(e) {
      if (e) e.preventDefault();
      charge(false);
    }
    function onKey(e) {

      if (e.key === ' ' || e.key === 'Spacebar' || e.key === 'ArrowUp') { e.preventDefault(); charge(true); }
    }
    function onKeyUp(e) {
      if (e.key === ' ' || e.key === 'Spacebar' || e.key === 'ArrowUp') { e.preventDefault(); charge(false); }
    }
    cv.addEventListener('pointerdown', onDown);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('keydown', onKey);
    window.addEventListener('keyup', onKeyUp);

    gen();
    hud('按住蓄力');
    raf = window.requestAnimationFrame(frame);

    return {
      teardown: function () {
        window.cancelAnimationFrame(raf);
        window.removeEventListener('pointerup', onUp);
        window.removeEventListener('keydown', onKey);
        window.removeEventListener('keyup', onKeyUp);
      },
      pause: function () {},
      resume: function () {},
      isPlaying: function () { return false; }
    };
  }

  /* ==================== 叠饼干塔 ==================== */
  function createStack(root) {
    var $ = function (s) { return root.querySelector(s); };
    root.innerHTML =
      '<div class="gbar">' +
        '<div class="stat"><span>叠了</span><b class="js-score">0</b></div>' +
        '<div class="stat"><span>最高</span><b class="js-best">0</b></div>' +
        '<div class="stat"><span>上一层</span><b class="js-w">100</b></div>' +
      '</div>' +
      '<div class="board"><canvas class="js-cv"></canvas></div>' +
      '<div class="hint">饼干在左右滑动，按 <kbd>空格</kbd> 或点画面就落下去。只留下重叠的部分，越叠越窄，叠歪了就塌了。</div>';

    var cv = $('.js-cv');
    var ctx = setupCanvas(cv, 66, 46, 10);
    var W = 660, H = 460, BH = 30, BASE = 392;

    var tower = [], cur = null, score = 0, best = stats.stackBest || 0;
    var camY = 0, camTarget = 0, phase = 'play';
    var raf = 0, last = 0;

    function hud() {
      $('.js-score').textContent = score;
      $('.js-best').textContent = best;
      $('.js-w').textContent = tower.length ? Math.round(tower[tower.length - 1].w) : 100;
    }

    function reset() {
      tower = [{ x: 200, w: 260 }];
      score = 0;
      camY = 0; camTarget = 0;
      phase = 'play';
      spawn();
      hud();
    }

    function spawn() {
      var top = tower[tower.length - 1];
      var w = top.w;
      var dir = Math.random() > 0.5 ? 1 : -1;
      var x = dir > 0 ? 40 : W - w - 40;
      cur = { x: x, w: w, dir: dir, speed: 2.4 + Math.min(3.4, score * 0.16) };
    }

    function drop() {
      if (phase !== 'play' || !cur) return;
      var top = tower[tower.length - 1];
      var nx = Math.max(cur.x, top.x);
      var nw = Math.min(cur.x + cur.w, top.x + top.w) - nx;

      if (nw <= 3) {
        phase = 'over';
        Sfx.click(180);

    function roundRect(x, y, w, h, r) {
      if (w < r * 2) r = Math.max(1, w / 2);
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);

      var y = BASE - (i + 1) * BH - camY;

      for (var k = 0; k <= 8; k++) {
        var xx = b.x + 5 + (b.w - 10) * (k / 8);
        ctx.lineTo(xx, y + (BH - 3) * 0.62 + (k % 2 ? 2.2 : -0.6));
      }
      ctx.stroke();
      ctx.lineWidth = 1;
    }

    function draw(ts) {
      ctx.clearRect(0, 0, W, H);
      var g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, '#fbf7ee');
      g.addColorStop(1, '#f2ebdc');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);

      // 桌面
      ctx.strokeStyle = '#e6ddc9';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(20, BASE + 2);
      ctx.lineTo(W - 20, BASE + 2);
      ctx.stroke();

      tower.forEach(function (b, i) { drawBiscuit(b, i); });

      if (cur && phase === 'play') {
        var top = tower[tower.length - 1];
        var y = BASE - (tower.length + 1) * BH - camY;
        // 落点提示
        var nx = Math.max(cur.x, top.x);
        var nw = Math.min(cur.x + cur.w, top.x + top.w) - nx;
        if (nw > 0) {
          ctx.fillStyle = 'rgba(176,90,50,.14)';
          roundRect(nx, y, nw, BH - 3, 7);
          ctx.fill();
        }
        drawBiscuit({ x: cur.x, w: cur.w }, tower.length);
        // 虚线对齐参考
        ctx.setLineDash([5, 5]);
        ctx.strokeStyle = 'rgba(140,130,115,.6)';
        ctx.lineWidth = 1.2;
        [top.x, top.x + top.w].forEach(function (xx) {
          ctx.beginPath();
          ctx.moveTo(xx, y - 40);
          ctx.lineTo(xx, BASE - camY);
          ctx.stroke();
        });
        ctx.setLineDash([]);
      }

      if (phase === 'over') {
        ctx.fillStyle = 'rgba(255,253,248,.93)';
        roundRect(W / 2 - 120, 150, 240, 96, 14);
        ctx.fill();
        ctx.strokeStyle = '#e3ddd0';
        ctx.lineWidth = 1;
        roundRect(W / 2 - 120, 150, 240, 96, 14);
        ctx.stroke();
        ctx.fillStyle = '#1d1b18';
        ctx.textAlign = 'center';
        ctx.font = '600 20px -apple-system,sans-serif';
        ctx.fillText('塌了…叠了 ' + score + ' 层', W / 2, 190);
        ctx.font = '400 13px -apple-system,sans-serif';
        ctx.fillStyle = '#8d8579';
        ctx.fillText('点一下重新开始', W / 2, 218);
        ctx.textAlign = 'left';
      }
    }

    function frame(ts) {
      var dt = last ? Math.min(48, ts - last) : 16;
      last = ts;
      var k = dt / 16.7;

      if (cur && phase === 'play') {
        cur.x += cur.dir * cur.speed * k;
        if (cur.x < 24) { cur.x = 24; cur.dir = 1; }
        if (cur.x + cur.w > W - 24) { cur.x = W - 24 - cur.w; cur.dir = -1; }
      }
      camY += (camTarget - camY) * 0.1 * k;

      draw(ts);
      raf = window.requestAnimationFrame(frame);
    }

    function act() {
      if (phase === 'over') reset();
      else drop();
    }

    function onKey(e) {
      if (e.key === ' ' || e.key === 'Spacebar' || e.key === 'ArrowUp') { e.preventDefault(); act(); }
    }
    window.addEventListener('keydown', onKey);
    cv.addEventListener('pointerdown', function (e) { e.preventDefault(); act(); });

    reset();
    raf = window.requestAnimationFrame(frame);

    return {
      teardown: function () {
        window.cancelAnimationFrame(raf);
        window.removeEventListener('keydown', onKey);
      },
      pause: function () {},
      resume: function () {},
      isPlaying: function () { return false; }
    };
  }

  var GAMES = {
    cord: { title: '耳机线', create: createCord },
    whack: { title: '敲地鼠', create: createWhack },
    claw: { title: '抓娃娃', create: createClaw },
    fish: { title: '钓鱼', create: createFish },
    jump: { title: '跳一跳', create: createJump },
    stack: { title: '叠饼干塔', create: createStack },
    bubble: { title: '戳泡泡', create: createBubble },
    duel: { title: '双人对撞', create: createDuel },
    gomoku: { title: '五子棋', create: createGomoku },
    tug: { title: '双人拔河', create: createTug },
    memory: { title: '记忆翻牌', create: createMemory },
    cards: { title: '抽卡字卡', create: createCards },
    match: { title: '合拍卡', create: createMatch }
  };

  /* ==================== 音效 ==================== */
  var Sfx = (function () {
    var on = stats.sfx !== false;
    var bus = null;
    var noise = null;

    function ensure() {
      var a = Music.ctxget();
      if (!a) return null;
      if (!bus) {
        bus = a.createGain();
        bus.gain.value = 0.5;
        bus.connect(a.destination);
      }
      if (a.state === 'suspended') { try { a.resume(); } catch (e) {} }
      return a;
    }

    function tone(freq, dur, type, peak, glideTo, delay) {
      if (!on) return;
      var a = ensure();
      if (!a) return;
      var t = a.currentTime + (delay || 0);
      var o = a.createOscillator();
      var g = a.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, t);
      if (glideTo) o.frequency.exponentialRampToValueAtTime(Math.max(40, glideTo), t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(peak, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g);
      g.connect(bus);
      o.start(t);
      o.stop(t + dur + 0.02);
    }

    function noiseBurst(dur, freq, peak) {
      if (!on) return;
      var a = ensure();
      if (!a) return;
      if (!noise) {
        var len = Math.floor(a.sampleRate * 0.5);
        noise = a.createBuffer(1, len, a.sampleRate);
        var d = noise.getChannelData(0);
        for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      }
      var t = a.currentTime;
      var src = a.createBufferSource();
      src.buffer = noise;
      var bp = a.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.value = freq || 900;
      bp.Q.value = 0.8;
      var g = a.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(peak || 0.2, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(bp);
      bp.connect(g);
      g.connect(bus);
      src.start(t);
      src.stop(t + dur + 0.02);
    }

    return {
      isOn: function () { return on; },
      setOn: function (v) {
        on = !!v;
        stats.sfx = on;
        save(K.stats, stats);
      },
      pop: function (combo) {
        var f = 430 + Math.min(620, (combo || 0) * 22);
        tone(f, 0.15, 'sine', 0.26, f * 0.55);
        tone(f * 1.6, 0.07, 'sine', 0.07, f * 0.9, 0.005);
      },
      click: function (f) { tone(f || 520, 0.06, 'triangle', 0.16, (f || 520) * 0.9); },
      win: function () {
        tone(659, 0.16, 'sine', 0.18);
        tone(880, 0.16, 'sine', 0.16, null, 0.08);
        tone(1175, 0.22, 'sine', 0.14, null, 0.16);
      },
      bite: function () {
        tone(300, 0.12, 'sine', 0.24, 170);
        tone(260, 0.14, 'sine', 0.18, 150, 0.14);
      },
      splash: function () { noiseBurst(0.28, 1200, 0.16); }
    };
  })();

  /* ==================== 背景音乐（小光盘） ==================== */
  var Music = (function () {
    var ac = null, master = null, synthBus = null, dly = null;
    var mode = 'synth', playing = false, starting = false;
    var timer = null, nextTime = 0, step = 0;
    var audio = null, tracks = [], curTrack = -1;
    var vol = typeof stats.musicVol === 'number' ? stats.musicVol : 0.42;

    var ROOTS = [0, 7, 5, 9];
    var SCALE = [0, 2, 4, 7, 9, 12, 14, 16];
    var BASE = 196;

    function midi(semi) { return BASE * Math.pow(2, semi / 12); }

    function impulse(sec, decay) {
      var rate = ac.sampleRate, len = Math.floor(rate * sec);
      var buf = ac.createBuffer(2, len, rate);
      for (var ch = 0; ch < 2; ch++) {
        var d = buf.getChannelData(ch);
        for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
      }
      return buf;
    }

    function init() {
      if (ac) return ac;
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try {
        ac = new AC();
      } catch (e) { return null; }

      master = ac.createGain();
      master.gain.value = vol;
      master.connect(ac.destination);

      var conv = ac.createConvolver();
      conv.buffer = impulse(2.8, 2.4);
      var wet = ac.createGain();
      wet.gain.value = 0.34;
      conv.connect(wet);
      wet.connect(master);

      synthBus = ac.createGain();
      synthBus.gain.value = 0.0001;
      synthBus.connect(master);
      synthBus.connect(conv);

      dly = ac.createDelay(1);
      dly.delayTime.value = 0.44;
      var fb = ac.createGain();
      fb.gain.value = 0.28;
      var dWet = ac.createGain();
      dWet.gain.value = 0.3;
      dly.connect(fb);
      fb.connect(dly);
      dly.connect(dWet);
      dWet.connect(master);
      dly.connect(conv);
      return ac;
    }

    function padAt(semi, t) {
      var f = midi(semi);
      [0, 7].forEach(function (det, i) {
        var o = ac.createOscillator();
        var g = ac.createGain();
        o.type = 'sine';
        o.frequency.value = f;
        o.detune.value = det;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(i ? 0.035 : 0.055, t + 2.0);
        g.gain.linearRampToValueAtTime(0.0001, t + 5.4);
        o.connect(g);
        g.connect(synthBus);
        o.start(t);
        o.stop(t + 5.6);
      });
    }

    function pluckAt(semi, t, amp) {
      var o = ac.createOscillator();
      var g = ac.createGain();
      o.type = 'triangle';
      o.frequency.value = midi(semi);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(amp || 0.06, t + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 1.2);
      o.connect(g);
      g.connect(synthBus);
      g.connect(dly);
      o.start(t);
      o.stop(t + 1.3);
    }

    function schedule() {
      if (!ac || mode !== 'synth' || !playing) return;
      var now = ac.currentTime;
      if (nextTime < now) nextTime = now + 0.12;
      while (nextTime < now + 0.9) {
        var bar = Math.floor(step / 8) % ROOTS.length;
        var chord = ROOTS[bar];
        if (step % 8 === 0) {
          padAt(chord, nextTime);
          padAt(chord + 7, nextTime);
          padAt(chord + 12, nextTime);
        }
        var b = step % 8;
        if (b !== 6) pluckAt(chord + 12 + SCALE[(step * 3) % SCALE.length], nextTime, 0.052);
        if (b === 4) pluckAt(chord + 24 + SCALE[step % SCALE.length], nextTime + 0.28, 0.028);
        nextTime += 0.56;
        step++;
      }
    }

    function startSynth() {
      if (!init()) return false;
      if (ac.state === 'suspended') ac.resume();
      mode = 'synth';
      playing = true;
      step = 0;
      nextTime = ac.currentTime + 0.1;
      synthBus.gain.cancelScheduledValues(ac.currentTime);
      synthBus.gain.setTargetAtTime(0.9, ac.currentTime, 0.5);
      if (timer) window.clearInterval(timer);
      timer = window.setInterval(schedule, 260);
      schedule();
      return true;
    }

    function stopSynth() {
      playing = false;
      if (timer) { window.clearInterval(timer); timer = null; }
      if (synthBus && ac) synthBus.gain.setTargetAtTime(0.0001, ac.currentTime, 0.3);
    }

    function playTrack(i) {
      if (!tracks[i]) return;
      stopSynth();
      if (!audio) { audio = new Audio(); audio.loop = true; }
      if (audio.src !== tracks[i].url) audio.src = tracks[i].url;
      audio.volume = vol;
      var p = audio.play();
      if (p && p.catch) p.catch(function () {});
      curTrack = i;
      mode = 'file';
      playing = true;
      paint();
    }

    function toggle() {
      if (playing) {
        if (mode === 'file' && audio) { audio.pause(); playing = false; }
        else stopSynth();
      } else {
        if (mode === 'file' && audio && curTrack >= 0) {
          audio.volume = vol;
          var p = audio.play();
          if (p && p.catch) p.catch(function () {});
          playing = true;
        } else {
          startSynth();
        }
      }
      paint();
    }

    function setVolume(v) {
      vol = Math.max(0, Math.min(1, v));
      stats.musicVol = vol;
      save(K.stats, stats);
      if (master && ac) master.gain.setTargetAtTime(vol, ac.currentTime, 0.08);
      if (audio) audio.volume = vol;
    }

    function addFiles(list) {
      var added = 0;
      for (var i = 0; i < list.length; i++) {
        var f = list[i];
        if (!/^audio\//.test(f.type) && !/\.(mp3|m4a|aac|wav|ogg|oga|flac|opus)$/i.test(f.name)) continue;
        tracks.push({ name: f.name.replace(/\.[^.]+$/, ''), url: URL.createObjectURL(f) });
        added++;
      }
      return added;
    }

    function label() {
      if (mode === 'file' && tracks[curTrack]) return tracks[curTrack].name;
      return '内置 · 慢板';
    }

    return {
      toggle: toggle,
      setVolume: setVolume,
      addFiles: addFiles,
      playTrack: playTrack,
      label: label,
      tracks: function () { return tracks; },
      cur: function () { return curTrack; },
      volume: function () { return vol; },
      ctxget: function () { return init(); },
      isPlaying: function () { return playing; }
    };
  })();

  var discBtn = document.getElementById('discBtn');
  var discTab = document.getElementById('discTab');
  var discWrap = document.getElementById('discWrap');
  var mPlayBtn = document.querySelector('.js-mplay');
  var mName = document.querySelector('.js-mname');
  var mVol = document.querySelector('.js-mvol');
  var mList = document.querySelector('.js-mlist');
  var audioPick = document.getElementById('audioPick');

  function paint() {
    var on = Music.isPlaying();
    discBtn.classList.toggle('spin', on);
    discBtn.classList.toggle('off', !on);
    mPlayBtn.textContent = on ? '暂停' : '播放';
    mName.textContent = Music.label();
    var ts = Music.tracks();
    mList.innerHTML = '';
    if (!ts.length) {
      var li = document.createElement('li');
      li.style.cursor = 'default';
      li.textContent = '还没有自己的歌';
      mList.appendChild(li);
    } else {
      ts.forEach(function (t, i) {
        var li = document.createElement('li');
        li.textContent = t.name;
        if (Music.cur() === i) li.className = 'on';
        li.addEventListener('click', function () { Music.playTrack(i); paint(); });
        mList.appendChild(li);
      });
    }
  }

  discBtn.addEventListener('click', function () {
    Music.toggle();
    paint();
  });
  discTab.addEventListener('click', function (e) {
    e.stopPropagation();
    discWrap.classList.toggle('open');
  });
  mPlayBtn.addEventListener('click', function () {
    Music.toggle();
    paint();
  });
  document.querySelector('.js-mimp').addEventListener('click', function () { audioPick.click(); });
  audioPick.addEventListener('change', function () {
    var list = audioPick.files;
    if (!list || !list.length) return;
    var n = Music.addFiles(list);
    audioPick.value = '';
    if (n) {
      Music.playTrack(Music.tracks().length - n);
      paint();
    }
  });
  mVol.value = String(Math.round(Music.volume() * 100));
  mVol.addEventListener('input', function () {
    Music.setVolume(Number(mVol.value) / 100);
  });


  var sfxBtn = document.querySelector('.js-sfx');
  function paintSfx() {
    sfxBtn.textContent = Sfx.isOn() ? '开' : '关';
    sfxBtn.classList.toggle('on', Sfx.isOn());
  }
  sfxBtn.addEventListener('click', function () { Sfx.setOn(!Sfx.isOn()); paintSfx(); });
  paintSfx();

  paint();

  /* ==================== 存档 ==================== */
  var saveBtn = document.querySelector('.js-save-file');
  var loadBtn = document.querySelector('.js-load-file');
  var savePick = document.getElementById('savePick');

  saveBtn.addEventListener('click', function () {
    var d = new Date();
    var stamp = d.getFullYear() + ('0' + (d.getMonth() + 1)).slice(-2) + ('0' + d.getDate()).slice(-2);
    var data = { app: 'tata-site', v: 1, at: d.toISOString(), profile: profile, rival: rival, stats: stats, theme: themeId };
    var blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = (profile.name || '挞挞') + '的小站-存档-' + stamp + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    window.setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  });

  loadBtn.addEventListener('click', function () {
    savePick.value = '';
    savePick.click();
  });

  savePick.addEventListener('change', function () {
    var f = savePick.files && savePick.files[0];
    if (!f) return;
    var fr = new FileReader();
    fr.onload = function () {
      var d = null;
      try { d = JSON.parse(fr.result); } catch (e) { d = null; }
      if (!d || d.app !== 'tata-site') {
        window.alert('这个文件不是小站的存档。');
        return;
      }
      if (!window.confirm('读存档会覆盖这台电脑现在的头像、战绩、卡库和色调，确定吗？')) return;
      if (d.profile) save(K.profile, d.profile);
      if (d.rival) save(K.rival, d.rival);
      if (d.stats) save(K.stats, d.stats);
      if (d.theme) save(K.theme, d.theme);
      window.location.reload();
    };
    fr.readAsText(f);
  });

  window.addEventListener('pagehide', function () {
    save(K.profile, profile);
    save(K.rival, rival);
    save(K.stats, stats);
  });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') {
      save(K.profile, profile);
      save(K.rival, rival);
      save(K.stats, stats);
    }
  });

  /* ==================== 启动 ==================== */
  renderCards();
  renderProfile();
  renderStats();
  markSaved();

  window.addEventListener('resize', function () {});
})();
</script>
